<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>Flow CS Hub · CS 직원 전용</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
:root {
  /* Flow CS Hub Brand v3 (2026-10-28) — SaaS 업무 플랫폼 톤: 중성 그레이 바탕 + 오렌지 강조 + 보라 AI */
  --orange: #FF7621;
  --orange-deep: #E85D00;
  --orange-light: #FFB380;
  --orange-wash: #FFF2E6;
  --purple: #6C4CE4;
  --purple-soft: #EFEAFB;
  --cream: #FFF8F0;
  --ink: #17212F;
  --body: #4B5563;
  --muted: #9CA3AF;
  --line: #E7EAF0;
  --paper: #FFFFFF;
  --surface: #FFFFFF;
  --bg: #F8F9FB;
  --hover: #F3F5F9;
  --active: #FFF2E6;
  --success: #16866F;
  /* 기존 호환 */
  --primary: var(--ink);
  --primary-light: var(--orange-deep);
  --accent: var(--orange);
  --sand: var(--orange-light);
  --shadow: 0 4px 12px rgba(23,33,47,0.06);
}
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
}
/* 상단 헤더 — 얇고 조용히 */
.header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  border-bottom: 1px solid var(--line);
}
.logo {
  font-family: 'Space Grotesk', 'Pretendard', sans-serif;
  font-weight: 700; font-size: 20px;
  letter-spacing: -0.02em; color: var(--ink);
  cursor: pointer; white-space: nowrap;
  display: flex; flex-direction: column; gap: 2px; line-height: 1.1;
}
.logo span { color: var(--orange); }
.logo-sub {
  font-size: 11.5px; color: var(--muted); font-weight: 500;
  letter-spacing: -0.01em; font-family: 'Pretendard', sans-serif;
}
.header-actions {
  display: flex; align-items: center; gap: 18px;
  font-size: 13px; color: var(--body);
}
.src-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; color: var(--body);
}
.src-dot { width: 7px; height: 7px; border-radius: 50%; background: #10B981; display: inline-block; }
/* 레이아웃 3단: 사이드바 + 메인 + 챗봇 패널 */
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 460px;
  min-height: calc(100vh - 60px);
}
@media (max-width: 1280px) {
  .layout { grid-template-columns: 220px minmax(0, 1fr) 400px; }
}
@media (max-width: 1024px) {
  .layout { grid-template-columns: 220px 1fr; }
  .chatbot-panel { display: none; }
}
/* 챗봇 상시 패널 (데스크톱) */
.chatbot-panel {
  background: white;
  border-left: 1px solid var(--line);
  position: sticky; top: 60px;
  height: calc(100vh - 60px);
  display: flex; flex-direction: column;
  overflow: hidden;
}
/* 챗봇 창이 패널로 도킹된 상태 */
#flow-bot-window.docked {
  position: static !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  border: none !important;
  display: flex !important;
  right: auto !important; bottom: auto !important; left: auto !important; top: auto !important;
}
/* 사이드바 */
.sidebar {
  background: white;
  border-right: 1px solid var(--line);
  padding: 20px 12px;
  overflow-y: auto;
  position: sticky; top: 60px; height: calc(100vh - 60px);
}
.sidebar-section {
  margin-bottom: 20px;
}
.sidebar-title {
  padding: 10px 16px;
  font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em;
  color: var(--ink);
  user-select: none;
  display: flex; align-items: center; gap: 8px;
  border-radius: 10px;
  transition: all 0.15s;
}
.sidebar-title:hover { background: var(--orange-wash); }
.sidebar-title.is-active { background: var(--orange-wash); color: var(--orange-deep); font-weight: 700; }
.sidebar-title.is-active .st-count { background: var(--orange); color: white; }
.sidebar-title .caret {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; width: 14px; height: 14px; border-radius: 4px;
  color: var(--muted); cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.sidebar-title .caret:hover { background: rgba(0,0,0,0.08); color: var(--ink); }
.sidebar-title.is-active .caret { color: var(--orange-deep); }
.sidebar-title .st-label {
  flex: 1; cursor: pointer; min-width: 0;
}
.sidebar-title .st-count {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: transparent; padding: 2px 8px; border-radius: 10px;
  cursor: pointer; font-family: 'Space Grotesk', sans-serif;
  font-feature-settings: 'tnum';
}
.sidebar-title:hover .st-count { background: rgba(249,115,22,0.15); color: var(--orange-deep); }
.sidebar-section.collapsed .caret { transform: rotate(-90deg); }
.sidebar-section.collapsed .sidebar-item.sub { display: none; }
.sidebar-item {
  padding: 8px 20px; cursor: pointer;
  color: var(--ink); font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  border-left: 3px solid transparent;
  transition: all 0.1s;
}
.sidebar-item {
  padding: 10px 14px;
  border-radius: 10px;
  border-left: none;
  margin: 2px 0;
  font-size: 13.5px;
  color: var(--body);
}
.sidebar-item:hover { background: var(--hover); color: var(--ink); }
.sidebar-item.active {
  background: var(--orange-wash); color: var(--orange-deep);
  font-weight: 700; border-left: none;
}
.sidebar-item.active .sidebar-count { background: var(--orange); color: white; }
.sidebar-item.sub {
  padding-left: 36px; font-size: 12.5px; color: var(--body);
  border-radius: 8px;
}
.sidebar-item.sub.active { color: var(--orange-deep); font-weight: 700; background: var(--orange-wash); }
.sidebar-item.sub.active .sidebar-count { background: var(--orange); color: white; }
.sidebar-count {
  margin-left: auto; font-size: 11px;
  color: var(--muted); background: #f0f0f0;
  padding: 2px 8px; border-radius: 10px;
}
/* 메인 */
.main {
  padding: 24px 32px;
  overflow-y: auto;
}
.breadcrumb {
  color: var(--muted); font-size: 12px; margin-bottom: 12px;
}
.breadcrumb span { margin: 0 6px; }
.page-title {
  font-size: 22px; font-weight: 800; margin-bottom: 4px;
}
.page-sub {
  color: var(--muted); font-size: 13px; margin-bottom: 24px;
}
/* 홈 Hero — 오렌지 wash 그라데이션 + AI 강조 + 뱃지 3개 */
.hero {
  background: linear-gradient(135deg, #FFE4CC 0%, #FFD4B2 60%, #FFC28A 100%);
  color: var(--ink); padding: 32px 36px;
  border-radius: 20px;
  margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute;
  right: 20px; top: -80px;
  width: 240px; height: 240px; border-radius: 50%;
  background: rgba(255,118,33,0.15); pointer-events: none;
}
.hero::after {
  content: ''; position: absolute;
  right: -40px; bottom: -60px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,118,33,0.1); pointer-events: none;
}
.hero-text { position: relative; z-index: 2; max-width: 72%; }
.hero-eyebrow {
  font-weight: 600; font-size: 12px;
  margin-bottom: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: white; border-radius: 999px;
  color: var(--orange-deep);
  box-shadow: 0 2px 6px rgba(23,33,47,0.06);
}
.hero h1 {
  font-family: 'Pretendard', sans-serif;
  font-weight: 900; font-size: clamp(26px, 3vw, 36px);
  line-height: 1.2; letter-spacing: -0.03em;
  margin-bottom: 12px; color: var(--ink);
}
.hero h1 .ai-mark { color: var(--orange-deep); }
.hero p {
  font-size: 14px; color: rgba(23,33,47,0.75);
  max-width: 540px; font-weight: 500; line-height: 1.55;
  margin-bottom: 18px;
}
.hero-badges {
  display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 2;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: rgba(255,255,255,0.7);
  border-radius: 999px; font-size: 12px; font-weight: 600;
  color: var(--orange-deep);
  backdrop-filter: blur(4px);
}
.hero-badge::before {
  content: '●'; color: var(--orange); font-size: 8px;
}
/* 떠있는 NEW 라벨 (유지) */
.hero-tag {
  display: none;
}

/* 홈 CTA + 통계 한 줄 바 */
.home-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; margin: 14px 0 16px; flex-wrap: wrap;
}
.home-bar .ctas { display: flex; gap: 8px; align-items: center; }
.btn-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 999px;
  font-weight: 600; font-size: 12.5px; cursor: pointer; text-decoration: none;
  transition: all 0.15s;
}
.btn-pill.primary { background: var(--ink); color: var(--cream); }
.btn-pill.primary:hover { background: var(--orange-deep); }
.btn-pill.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn-pill.ghost:hover { background: var(--ink); color: var(--cream); }
.home-stats { display: flex; gap: 28px; }
.home-stat .n {
  font-family: 'Pretendard', sans-serif;
  font-weight: 900; font-size: 24px; letter-spacing: -0.03em; line-height: 1;
  color: var(--ink); font-feature-settings: 'tnum';
}
.home-stat .n .unit { font-size: 14px; color: var(--muted); margin-left: 2px; font-weight: 700; }
.home-stat .label { font-size: 10.5px; color: var(--muted); margin-top: 4px;
  font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }

/* 섹션 타이틀 */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 24px 0 6px;
}
.section-head h2 {
  font-family: 'Pretendard', sans-serif;
  font-weight: 900; font-size: 20px; letter-spacing: -0.025em;
}
.section-sub {
  font-size: 13px; color: var(--muted); margin: 2px 0 14px;
}

/* 홈 균일 카드 그리드 — 2x3 ~ 4개 열 반응형 */
.dash-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.dash-card {
  background: white; border-radius: 14px;
  padding: 20px 22px;
  cursor: pointer; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 16px;
  border: 1px solid var(--line);
  min-height: 84px;
}
.dash-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px -8px rgba(23,33,47,0.1);
  border-color: var(--orange);
}
.dash-card .icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; margin-bottom: 0;
  background: var(--orange-wash); color: var(--orange-deep);
}
.dash-card .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.dash-card h3 {
  font-size: 15px; color: var(--ink); font-weight: 700;
  letter-spacing: -0.01em; margin: 0;
}
.dash-card .count {
  font-weight: 700; font-size: 12px;
  color: var(--muted); font-feature-settings: 'tnum';
  margin-left: auto;
}
.dash-card .count .unit { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 1px; }
.dash-card .sub {
  font-size: 12.5px; color: var(--muted); font-weight: 500;
  line-height: 1.4; margin: 0;
}
.dash-card .desc { display: none; }
.dash-card .card-arrow {
  color: var(--muted); font-size: 16px; margin-left: 8px;
}
.dash-card:hover .card-arrow { color: var(--orange); }

/* 캠퍼스 바로가기 (외부 링크) */
.campus-links {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 10px; margin-bottom: 32px;
}
.campus-link {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; background: white;
  border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: var(--ink);
  font-weight: 600; font-size: 14px;
  transition: all 0.15s;
}
.campus-link:hover {
  border-color: var(--orange);
  box-shadow: 0 6px 16px -6px rgba(23,33,47,0.08);
  transform: translateY(-1px);
}
.campus-link .cl-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--orange-wash); color: var(--orange-deep);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.campus-link .cl-label { flex: 1; }
.campus-link .cl-arrow { color: var(--muted); font-size: 13px; }
.campus-link:hover .cl-arrow { color: var(--orange); }

/* 자주 쓰는 링크 카드 */
.link-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.link-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 14px 16px; background: white;
  border: 1px solid var(--line); border-radius: 12px;
  text-decoration: none; color: var(--ink);
  transition: all 0.15s;
}
.link-card:hover {
  border-color: var(--orange);
  box-shadow: 0 6px 16px -6px rgba(23,33,47,0.08);
  transform: translateY(-1px);
}
.link-card .lc-head { display: flex; align-items: center; justify-content: space-between; }
.link-card .lc-ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--purple-soft); color: var(--purple);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.link-card .lc-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
  padding: 3px 8px; background: var(--purple-soft); color: var(--purple);
  border-radius: 999px; text-transform: uppercase;
}
.link-card .lc-title { font-size: 13px; font-weight: 600; line-height: 1.4; min-height: 36px; }
.link-card .lc-preview {
  font-size: 11px; color: var(--muted); line-height: 1.5;
  padding: 8px 10px; background: #FAFBFC; border-radius: 7px;
  border-left: 2px solid var(--purple-soft);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.link-card .lc-actions {
  display: flex; gap: 6px; margin-top: 8px; align-items: center;
}
.link-card .lc-btn {
  flex: 1; padding: 7px 10px; font-size: 11px; font-weight: 600;
  background: #F3F4F6; color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; cursor: pointer; white-space: nowrap;
  transition: all 0.12s;
}
.link-card .lc-btn:hover { background: #E5E7EB; border-color: #D1D5DB; }
.link-card .lc-btn.primary {
  background: var(--orange); color: white; border-color: var(--orange);
}
.link-card .lc-btn.primary:hover { background: var(--orange-deep); border-color: var(--orange-deep); }
.link-card .lc-btn.icon {
  flex: 0 0 auto; padding: 7px 9px;
}
.link-card .lc-btn.copied { background: #10B981 !important; color: white !important; border-color: #10B981 !important; }

/* 복사 토스트 */
.copy-toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  padding: 12px 20px; background: var(--ink); color: white;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  box-shadow: 0 10px 30px -8px rgba(0,0,0,0.3);
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* 카테고리별 아이콘 색 (파스텔) */
.dash-card[data-cat="contacts"] .icon { background: var(--orange-wash); color: var(--orange-deep); }
.dash-card[data-cat="tuition"] .icon { background: #FEF3C7; color: #B45309; }
.dash-card[data-cat="admin"] .icon { background: var(--purple-soft); color: var(--purple); }
.dash-card[data-cat="parent_response"] .icon { background: #FCE7F3; color: #BE185D; }
.dash-card[data-cat="cs_appreciation"] .icon { background: #DBEAFE; color: #1D4ED8; }
.dash-card[data-cat="campus_guide"] .icon { background: #E0E7FF; color: #4338CA; }
.dash-card.external::after {
  content: '↗'; position: absolute; top: 14px; right: 14px;
  font-size: 15px; color: var(--muted);
}
.dash-card.external .icon { background: #D1FAE5; color: #065F46; }
/* 아이템 그리드 */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.card {
  background: white; border: 1px solid var(--line);
  border-radius: 10px; padding: 16px;
  transition: all 0.15s; cursor: pointer;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.card-tag {
  display: inline-block;
  background: var(--active); color: var(--accent);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px;
  margin-bottom: 8px; letter-spacing: 0.05em;
}
.card-title {
  font-size: 15px; font-weight: 700; margin-bottom: 8px;
}
.card-body { font-size: 13px; color: #374151; }
.card-body dt { color: var(--muted); font-size: 11px; margin-top: 6px; }
.card-body dd { margin-bottom: 4px; font-weight: 500; }
.card-body .price { font-size: 18px; font-weight: 800; color: var(--primary); }
.card-body .price-old { text-decoration: line-through; color: var(--muted); font-size: 12px; }
.card-body .price-up { color: #d97706; font-size: 12px; font-weight: 700; }
/* 검색 결과 */
.search-results {
  max-height: 400px; overflow-y: auto;
  position: absolute; top: 44px; left: 0; right: 0;
  background: white; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 8px; display: none; z-index: 100;
}
.search-results.open { display: block; }
.search-group-title {
  padding: 8px 12px; font-size: 11px; font-weight: 800;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
}
.search-item {
  padding: 8px 12px; cursor: pointer; border-radius: 6px;
  font-size: 13px;
}
.search-item:hover { background: var(--hover); }
.search-item mark { background: #fef3c7; color: inherit; padding: 0 2px; }
.search-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
/* 상세 뷰어 */
.detail {
  background: white; border-radius: 12px; padding: 24px;
  border: 1px solid var(--line);
}
.detail h2 { font-size: 20px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
.detail dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 20px; }
.detail dt { color: var(--muted); font-weight: 700; }
.detail dd { color: var(--ink); }
.detail .actions {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
  display: flex; gap: 8px;
}
.btn {
  padding: 8px 16px; border: 1px solid var(--line);
  background: white; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--ink);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: #0d9488; }
/* 로그인 오버레이 */
.auth-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(135deg, #1e3a5f 0%, #0f766e 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.auth-card {
  background: white; border-radius: 16px;
  padding: 40px 32px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
.auth-card .brand {
  font-size: 22px; font-weight: 800;

<script>
// ==================== 데이터 로드 ====================
let DATA = { contacts: [], tuition: [], admin: [], parent_response: [], cs_appreciation: [], campus_guide: [], meta: null };
let FUSE = null;  // Fuse.js 인스턴스 (전체 검색)

/* 한글 초성 추출 (예: "광교 초등관" → "ㄱㄱ ㅊㄷㄱ") */
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(s) {
  if (!s) return '';
  return String(s).split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) return CHOSUNG[Math.floor(code / 588)];
    return ch;
  }).join('');
}
function isChosungQuery(q) {
  // 쿼리에 자모 문자만 있으면 초성 검색으로 판단
  return /^[ㄱ-ㅎ\s]+$/.test(q);
}

/* Google Sheet CSV → JSON 변환 (연락처) */
function csvToContacts(rows) {
  return rows.filter(r => r.id).map(r => {
    const camp = r['캠퍼스'] || '';
    const gwan = r['관/시설'] || '';
    const sub = r['분류'] || '';
    let title;
    if (sub === '캠퍼스 대표') title = `${camp} 캠퍼스 대표번호`;
    else if (sub === '본사') title = `본사 ${gwan}`;
    else title = `${camp} ${gwan}`.trim();
    return {
      id: r.id,
      category: "contacts",
      subcategory: sub,
      campus: camp,
      gwan: gwan,
      title: title,
      content: {
        "위치": r['위치'] || '',
        "직통번호": r['직통번호'] || '',
        "대표번호": r['대표번호'] || '',
        "담당자": r['담당자'] || '',
        "내선": r['내선'] || r['내선번호'] || '',
        "학원등록번호": r['학원등록번호'] || '',
        "비고": r['비고'] || '',
      },
      tags: [camp, gwan, '연락처'].filter(Boolean),
      search_text: [camp, gwan, r['담당자'], r['직통번호'], r['내선'], r['위치'], r['학원등록번호'], r['비고']].filter(Boolean).join(' '),
      related: [],
      updated: new Date().toISOString().slice(0, 10),
      _source: 'google-sheet',
    };
  });
}

/* Google Sheet CSV → JSON 변환 (수강료) */
function csvToTuition(rows) {
  return rows.filter(r => r.id).map(r => {
    const y25 = r['25년_수강료'] ? parseInt(String(r['25년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const y26 = r['26년_수강료'] ? parseInt(String(r['26년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const up = (y25 && y26) ? y26 - y25 : 0;
    return {
      id: r.id,
      category: "tuition",
      subcategory: r['구분'] || '',
      campus: r['캠퍼스'] || '',
      gwan: `${r['사업부']||''} ${r['브랜드']||''}`.trim(),
      title: `${r['캠퍼스']||''} ${r['구분']||''} ${r['회당']||''} ${r['과정']||''}`.replace(/\s+/g, ' ').trim(),
      content: {

/* CSV → 행정자료 (id 안정화 + 열명 검증) */
function csvToFiles(rows) {
  if (!rows || !rows.length) return [];
  // 열명 검증: 필수 컬럼 하나라도 없으면 콘솔 경고 (조용한 실패 방지)
  const sample = rows[0] || {};
  const expected = ['파일명','분류','드라이브 링크'];
  const missing = expected.filter(k => !(k in sample) && !(sample.title || sample.drive_url));
  if (missing.length) {
    console.warn('[csvToFiles] 「행정자료」 시트 필수 컬럼 누락: ' + missing.join(', ') + ' — 시트 헤더(1행)를 확인하세요.');
  }
  // 간단 해시 (파일ID 없을 때 title+category 기반 안정적 id)
  const hashStr = s => {
    let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h).toString(36);
  };
  return rows.filter(r => (r['파일명'] || r.title)).map((r, idx) => {
    const title = r['파일명'] || r.title || '';
    const fileId = r['파일ID'] || r.file_id || '';
    const category = r['분류'] || r.category || '행정자료';
    // id 우선순위: 파일ID > 기존 id > title+category hash (행 순서 바뀌어도 북마크 유지)
    const stableId = fileId ? ('file-' + fileId)
                   : (r.id || ('file-h-' + hashStr(title + '|' + category)));
    return {
      id: stableId,
      title: title,
      category: category,
      description: r['설명'] || r.description || '',
      drive_url: r['드라이브 링크'] || r['링크'] || r.drive_url || '',
      download_url: r['다운로드 링크'] || r.download_url || '',
      updated: r['수정일'] || r.updated || '',
      keywords: r['키워드'] || r.keywords || '',
      file_type: r['파일 종류'] || r.file_type || '',
      _source: 'google-sheet',
    };
  });
}

/* Google Sheet CSV 로드 (실패 시 null) */
async function fetchSheetCSV(url) {
  if (!url || !/^https?:\/\//.test(url)) return null;
  try {
    // 캐시 무효화용 timestamp
    const sep = url.includes('?') ? '&' : '?';
    const bustUrl = url + sep + '_ts=' + Math.floor(Date.now() / 60000); // 1분 캐시
    const res = await fetch(bustUrl);
    if (!res.ok) return null;
    const text = await res.text();
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    if (parsed.errors.length && !parsed.data.length) return null;
    return parsed.data;
  } catch (e) {
    console.warn('시트 로드 실패, 로컬 JSON 사용:', e);
    return null;
  }
}

async function loadData() {
  // 시트 설정 먼저 로드
  let sheetConfig = { contacts_csv_url: '', tuition_csv_url: '' };
  try {
    sheetConfig = await fetch('data/sheet-config.json?_ts=' + Math.floor(Date.now() / 60000)).then(r => r.json());
  } catch {}

  const bust = '?_ts=' + Math.floor(Date.now() / 60000);
  const [c_local, t_local, a, pr, ca, cg, files_local, m, c_sheet, t_sheet, files_sheet] = await Promise.all([
    fetch('data/contacts.json' + bust).then(r => r.json()),
    fetch('data/tuition.json' + bust).then(r => r.json()),
    fetch('data/admin.json' + bust).then(r => r.json()),
    fetch('data/parent-response.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/cs-appreciation.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/campus-guide.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/files.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/meta.json' + bust).then(r => r.json()),
    fetchSheetCSV(sheetConfig.contacts_csv_url),
    fetchSheetCSV(sheetConfig.tuition_csv_url),
    fetchSheetCSV(sheetConfig.files_csv_url),
  ]);

  // 시트 데이터 있으면 우선 사용, 없으면 로컬
  const c = (c_sheet && c_sheet.length) ? csvToContacts(c_sheet) : c_local;
  const t = (t_sheet && t_sheet.length) ? csvToTuition(t_sheet) : t_local;
  // 🔗 files는 merge: 시트(공유 드라이브 자동) + 로컬 files.json(수동 외부 링크)
  // 중복 id는 로컬이 우선 (수동 등록이 더 최신 정보로 간주)
  const filesFromSheet = (files_sheet && files_sheet.length) ? csvToFiles(files_sheet) : [];
  const filesFromLocal = Array.isArray(files_local) ? files_local : [];
  const seenFileIds = new Set(filesFromLocal.map(f => f.id));
  const files = [...filesFromLocal, ...filesFromSheet.filter(f => !seenFileIds.has(f.id))];

  DATA.contacts = c; DATA.tuition = t; DATA.admin = a;
  DATA.parent_response = pr; DATA.cs_appreciation = ca; DATA.campus_guide = cg;
  DATA.files = files; DATA.meta = m;

  // 데이터 소스 배지
  const sourceInfo = document.getElementById('sourceInfo');
  if (sourceInfo) {
    const isLive = (c_sheet && c_sheet.length) || (t_sheet && t_sheet.length);
    sourceInfo.innerHTML = isLive
      ? '<span class="src-dot"></span>연락처·수강료 실시간 동기화'
      : '<span class="src-dot" style="background:#F59E0B"></span>로컬 데이터';
  }

  // 초성 필드 자동 추가
  const all = [...c, ...t, ...a, ...pr, ...ca, ...cg];
  all.forEach(item => {
    item.chosung_text = toChosung(item.search_text || '') + ' ' + toChosung(item.title || '');
  });

  // Fuse.js 인스턴스 (오타 허용 + 다중 필드)
  FUSE = new Fuse(all, {
    keys: [
      { name: 'title',        weight: 3 },
      { name: 'search_text',  weight: 2 },
      { name: 'tags',         weight: 1.5 },
      { name: 'chosung_text', weight: 1 },
    ],
    threshold: 0.35,      // 0(엄격) ~ 1(관대). 오타 허용도
    ignoreLocation: true, // 문장 위치 무관
    minMatchCharLength: 2,
    includeScore: true,
  });

  renderSidebar();
  renderRoute();
}

/* 모바일 사이드바 토글 */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  const open = sb.classList.toggle('mobile-open');
  bd.classList.toggle('show', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  sb.classList.remove('mobile-open');
  bd.classList.remove('show');
  document.body.style.overflow = '';
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { page: 'home' };
  const parts = h.split('/').map(decodeURIComponent);
  if (parts[0] === 'detail') return { page: 'detail', itemId: parts[1] };
  return {
    page: 'category',
    category: parts[0],
    subcategory: parts[1] || null,
  };
}

function renderRoute() {
  CURRENT = parseHash();
  renderSidebar(); // active 상태 갱신
  if (CURRENT.page === 'home') renderHome();
  else if (CURRENT.page === 'category') renderCategory();
  else if (CURRENT.page === 'detail') renderDetail();
}
window.addEventListener('hashchange', renderRoute);

// 자주 쓰는 링크 섹션 렌더링 (홈·카테고리 뷰 공용)
function renderLinkCardsSection(linkItems, opts) {
  opts = opts || {};
  if (!linkItems || linkItems.length === 0) return '';
  const groups = {};
  linkItems.forEach(f => {
    const key = `${f.campus||'기타'}|${f.gwan||''}`;
    if (!groups[key]) groups[key] = { campus: f.campus, gwan: f.gwan, items: [] };
    groups[key].items.push(f);
  });
  const typeIconMap = {
    '입학테스트': '📝', '설명회': '🎤', '상담': '💬', '약도': '🗺',
    '커뮤니티': '👥', '매뉴얼': '📘', '앱': '📱', '정책': '💰'
  };
  const typeMsgMap = {
    '입학테스트': '입학테스트 예약은 아래 링크로 신청해주세요.',
    '설명회': '설명회 신청은 아래 링크로 접수해주세요.',
    '상담': '아래 카카오톡 채널로 문의 주세요.',
    '약도': '오시는 길 안내입니다.',
    '커뮤니티': '학부모 소통 네이버 밴드 초대 링크입니다.',
    '매뉴얼': '학습 플랫폼 사용 안내입니다.',
    '앱': '학원친구 앱 설치 안내입니다.',
    '정책': '수강료 반환 기준은 아래 링크에서 확인하실 수 있습니다.'
  };
  const esc = s => (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const headingBlock = opts.heading ? `
    <div class="section-head" style="margin-top:${opts.marginTop||'36px'};">
      <h2>${escapeHtml(opts.heading)}</h2>
      ${opts.sub ? `<span style="font-size:12px; color:var(--muted);">${escapeHtml(opts.sub)}</span>` : ''}
    </div>` : '';
  return `
    ${headingBlock}
    ${Object.values(groups).map(g => `
      <div style="margin-top:14px;">
        <div style="font-size:13px; font-weight:600; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:8px;">
          <span style="padding:3px 10px; background:var(--orange); color:white; border-radius:999px; font-size:11px;">${escapeHtml(g.campus||'')} ${escapeHtml(g.gwan||'')}</span>
          <span style="color:var(--muted); font-weight:500;">${g.items.length}개 링크</span>
        </div>
        <div class="link-grid">
          ${g.items.map(f => `
            <div class="link-card">
              <div class="lc-head">
                <span class="lc-ic">${typeIconMap[f.type_tag]||'🔗'}</span>
                <span class="lc-tag">${escapeHtml(f.type_tag||'')}</span>
              </div>
              <div class="lc-title">${escapeHtml(f.title.replace(`${g.campus||''} ${g.gwan||''}`, '').trim() || f.title)}</div>
              <div class="lc-preview" title="안내문구와 복사 시 이 문장이 링크와 함께 복사됩니다">💬 "${escapeHtml(typeMsgMap[f.type_tag]||'아래 링크를 확인해주세요.')}"</div>
              <div class="lc-actions">
                <button type="button" class="lc-btn primary" onclick="copyLinkById('${esc(f.id)}')">📋 링크 복사</button>
                <button type="button" class="lc-btn" onclick="copyMessageById('${esc(f.id)}')">💬 안내문구와 복사</button>
                <button type="button" class="lc-btn icon" onclick="window.open('${esc(f.drive_url)}','_blank','noopener')" title="열어보기">👁</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function renderCategory() {
  const m = document.getElementById('main');
  const cat = CURRENT.category;
  const sub = CURRENT.subcategory;

  // 「자주 쓰는 링크」 전용 뷰
  if (cat === 'files' && sub === '자주 쓰는 링크') {
    const linkItems = (DATA.files||[]).filter(f => f.category === '자주 쓰는 링크');
    m.innerHTML = `
      <div class="breadcrumb">
        <span onclick="goHome()" style="cursor:pointer">홈</span> ›
        <span>자주 쓰는 링크</span>
      </div>
      <h1 class="page-title">🔗 자주 쓰는 링크</h1>
      <div class="page-sub">${linkItems.length}건 · 상담 중 바로 열어서 쓰는 캠퍼스·관별 링크</div>
      ${renderLinkCardsSection(linkItems, {marginTop:'0px'})}
    `;
    return;
  }

  const catInfo = DATA.meta.categories.find(c => c.key === cat);
  const items = DATA[cat] || [];

  let filtered = items;
  if (sub) {
    if (cat === 'contacts') filtered = items.filter(x => x.campus === sub);
    else filtered = items.filter(x => x.subcategory === sub);
  }

  const subLabel = sub;
  const breadcrumb = `
    <div class="breadcrumb">
      <span onclick="goHome()" style="cursor:pointer">홈</span> ›
      <span onclick="goCategory('${escapeAttr(cat)}')" style="cursor:pointer">${escapeHtml(catInfo.label)}</span>
      ${sub ? ` › <span>${escapeHtml(subLabel)}</span>` : ''}
    </div>
  `;

  m.innerHTML = `
    ${breadcrumb}
    <h1 class="page-title">${escapeHtml(catInfo.icon)} ${escapeHtml(subLabel || catInfo.label)}</h1>
    <div class="page-sub">${filtered.length}건</div>
    <div class="grid">
      ${filtered.map(item => renderCard(item)).join('')}
    </div>
  `;
}

function renderCard(item) {
  const eId = escapeAttr(item.id);
  const eTitle = escapeHtml(item.title);
  const eSub = escapeHtml(item.subcategory);
  if (item.category === 'contacts') {
    const c = item.content;
    return `
      <div class="card" onclick="goDetail('${eId}')">
        <div class="card-tag">${escapeHtml(item.campus)} · ${eSub}</div>
        <div class="card-title">${eTitle}</div>
        <div class="card-body">
          ${c.직통번호 ? `<dt>직통</dt><dd>${escapeHtml(c.직통번호)}</dd>` : ''}
          ${c.담당자 ? `<dt>담당자</dt><dd style="font-size:12px;">${escapeHtml(c.담당자)}</dd>` : ''}
          ${c.위치 ? `<dt>위치</dt><dd>${escapeHtml(c.위치)}</dd>` : ''}
          ${c.학원등록번호 ? `<dt>학원등록</dt><dd style="font-size:11px;">${escapeHtml(c.학원등록번호)}</dd>` : ''}
        </div>
      </div>
    `;
  }
  if (item.category === 'tuition') {
    const c = item.content;
    const up = c.인상액 > 0 ? `<span class="price-up">↑ ${c.인상액.toLocaleString()}</span>`
             : c.인상액 < 0 ? `<span style="color:#059669;font-size:12px;font-weight:700;">↓ ${Math.abs(c.인상액).toLocaleString()}</span>`
             : '';
    return `
      <div class="card" onclick="goDetail('${eId}')">
        <div class="card-tag">${eSub}</div>
        <div class="card-title">${eTitle}</div>
        <div class="card-body">
          <div class="price">${(c['26년_수강료']||0).toLocaleString()}원 ${up}</div>
          ${c['25년_수강료'] && c.인상액 ? `<div class="price-old">25년 ${c['25년_수강료'].toLocaleString()}원</div>` : ''}
          ${c.비고 ? `<dt>비고</dt><dd style="font-size:12px;">${escapeHtml(c.비고)}</dd>` : ''}
        </div>
      </div>
    `;
  }
  if (item.category === 'admin') {
    const c = item.content;
    let preview;
    if (c.본문) {
      preview = c.본문.substring(0, 100) + (c.본문.length > 100 ? '...' : '');
    } else if (item.subcategory.startsWith('Ⅲ')) {
      preview = `${c.반형태 || ''}${c['담당 CS'] ? ' · CS ' + c['담당 CS'] : ''}`.substring(0, 100);
    } else if (item.subcategory.startsWith('Ⅳ')) {
      preview = c.수익경로 || `${c.교육관||''}/${c.브랜드||''}/${c.캠퍼스||''}`;
    } else {
      preview = Object.values(c).filter(v => v).join(' · ').substring(0, 100);
    }
    return `
      <div class="card" onclick="goDetail('${eId}')">
        <div class="card-tag">${eSub}</div>
        <div class="card-title">${eTitle}</div>
        <div class="card-body" style="font-size:12px;color:var(--muted);">${escapeHtml(preview)}</div>
      </div>
    `;
  }
  if (item.category === 'parent-response' || item.category === 'parent_response' ||
      item.category === 'cs-appreciation' || item.category === 'cs_appreciation' ||
      item.category === 'campus-guide' || item.category === 'campus_guide') {
    const c = item.content;
    let preview = '';
    if (c.markdown) {
      preview = c.markdown.replace(/[#*\-\n]/g, ' ').replace(/\s+/g, ' ').substring(0, 110) + '...';
    } else if (c.recommended) {
      preview = '✅ ' + c.recommended.substring(0, 90).replace(/\n/g, ' ') + '...';
    }
    return `
      <div class="card" onclick="goDetail('${eId}')">
        <div class="card-tag">${eSub}</div>
        <div class="card-title">${eTitle}</div>
        <div class="card-body" style="font-size:12px;color:var(--muted);">${escapeHtml(preview)}</div>
      </div>
    `;
  }
  return '';
}

// ==================== 상세 뷰어 ====================
function allItems() {
  const files = (DATA.files||[]).map(f => ({
    id: f.id, category: 'files', subcategory: f.category || '행정자료',
    title: f.title, content: f.description || '',
    campus: f.campus || '',
    gwan: f.gwan || '',
    type_tag: f.type_tag || '',
    search_text: [f.title, f.description, f.category, f.keywords, f.campus, f.gwan, f.type_tag].filter(Boolean).join(' '),
    tags: [f.category, f.type_tag, f.campus, f.gwan, '파일'].filter(Boolean),
    drive_url: f.drive_url, download_url: f.download_url,
  }));
  return [...DATA.contacts, ...DATA.tuition, ...DATA.admin, ...DATA.parent_response, ...DATA.cs_appreciation, ...DATA.campus_guide, ...files];
}

/* 간단 마크다운 렌더러 */
function renderMarkdown(md) {
  if (!md) return '';
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = escape(md);
  // 헤딩
  out = out.replace(/^## (.+)$/gm, '<h3 class="md-h3">$1</h3>');
  out = out.replace(/^# (.+)$/gm, '<h2 class="md-h2">$1</h2>');
  // 볼드
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // URL 자동 링크화 (http/https) — 기존 <a> 안이 아닌 raw URL만
  out = out.replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#1a73e8; text-decoration:underline; word-break:break-all;">$1</a>');
  // 리스트 (- 로 시작)
  out = out.replace(/(?:^- .+(?:\n|$))+/gm, block => {
    const items = block.trim().split('\n').map(l => l.replace(/^- /, '').trim());
    return '<ul class="md-ul">' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
  });
  // 문단 (빈 줄로 구분)
  out = out.split(/\n\n+/).map(p => {
    if (p.match(/^<(h2|h3|ul)/)) return p;
    return `<p class="md-p">${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return out;
}

function renderDetail() {
  const m = document.getElementById('main');
  const item = allItems().find(x => x.id === CURRENT.itemId);
  if (!item) {
    m.innerHTML = `<div>항목을 찾을 수 없습니다.</div>`;
    return;
  }
  const catInfo = DATA.meta.categories.find(c => c.key === item.category || c.key === item.category.replace('-','_'));

  let body = '';

  // 학부모 응대 · CS 감탄 · 캠퍼스별 상담자료 (markdown 또는 recommended/avoid)
  if (item.category === 'parent-response' || item.category === 'parent_response' ||
      item.category === 'cs-appreciation' || item.category === 'cs_appreciation' ||
      item.category === 'campus-guide' || item.category === 'campus_guide') {
    const c = item.content;
    let parts = [];
    if (c.markdown) {
      parts.push(`<div class="md-body">${renderMarkdown(c.markdown)}</div>`);
    }
    if (c.recommended) {
      parts.push(`
        <div class="response-block ok">
          <div class="response-label">✅ 권장 답변</div>
          <div class="response-text">${escapeHtml(c.recommended).replace(/\n/g, '<br>')}</div>
        </div>
      `);
    }
    if (c.avoid) {
      parts.push(`
        <div class="response-block ng">
          <div class="response-label">❌ 피해야 할 응대</div>
          <div class="response-text">${escapeHtml(c.avoid).replace(/\n/g, '<br>')}</div>
        </div>
      `);
    }
    body = parts.join('');
  } else if (item.category === 'admin' && item.content && item.content.markdown) {
    // 행정 매뉴얼: markdown 필드 있으면 원문 렌더링
    body = `<div class="md-body">${renderMarkdown(item.content.markdown)}</div>`;
  } else if (item.category === 'files') {
    // 행정자료 파일: 분류·설명·파일종류·수정일 + 「구글 드라이브 열기」 버튼
    const raw = (DATA.files || []).find(f => f.id === item.id);
    const desc = raw && raw.description ? raw.description : (typeof item.content === 'string' ? item.content : '');
    const fileType = raw && raw.file_type ? raw.file_type : '';
    const updated = raw && raw.updated ? raw.updated : '';
    const driveUrl = raw && raw.drive_url ? raw.drive_url : (item.drive_url || '');
    const rows = [];
    if (item.subcategory) rows.push(`<dt>분류</dt><dd>${escapeHtml(item.subcategory)}</dd>`);
    if (desc) rows.push(`<dt>설명</dt><dd>${escapeHtml(desc)}</dd>`);
    if (fileType) rows.push(`<dt>파일 종류</dt><dd>${escapeHtml(fileType)}</dd>`);
    if (updated) rows.push(`<dt>수정일</dt><dd>${escapeHtml(updated)}</dd>`);
    const isDrive = /drive\.google\.com/.test(driveUrl);
    const btnLabel = isDrive ? '🔗 구글 드라이브에서 파일 열기' : '🔗 홈페이지에서 열기';
    const footer = isDrive
      ? '* 파일 미리보기·다운로드·공유는 구글 드라이브에서 진행됩니다.'
      : '* 외부 홈페이지로 이동합니다. 내용은 홈페이지에서 실시간 반영됩니다.';
    body = `<dl>${rows.join('')}</dl>` + (driveUrl ? `
      <div style="margin-top:20px; display:flex; gap:8px; flex-wrap:wrap;">
        <a href="${escapeAttr(driveUrl)}" target="_blank" rel="noopener"
           style="padding:10px 20px; background:#1a73e8; color:white; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px;">
          ${btnLabel}
        </a>
      </div>
      <div style="margin-top:10px; font-size:12px; color:var(--muted);">
        ${footer}
      </div>
    ` : `
      <div style="margin-top:16px; padding:10px 14px; background:#fef3c7; color:#b45309; border-radius:8px; font-size:13px;">
        ⚠️ 드라이브 링크가 등록되지 않았습니다. 「행정자료」 시트에서 링크 입력이 필요합니다.
      </div>
    `);
  } else {
    // 기존 contacts / tuition
    const rows = Object.entries(item.content).filter(([k,v]) => v).map(([k,v]) => `
      <dt>${escapeHtml(k)}</dt>
      <dd>${typeof v === 'number' ? v.toLocaleString() + (k.includes('수강료') || k.includes('인상액') ? '원' : '') : escapeHtml(v)}</dd>
    `).join('');
    body = `<dl>${rows}</dl>`;
  }

  const catLabel = catInfo ? catInfo.label : item.category;
  const catKey = catInfo ? catInfo.key : item.category;

  m.innerHTML = `
    <div class="breadcrumb">
      <span onclick="goHome()" style="cursor:pointer">홈</span> ›
      <span onclick="goCategory('${escapeAttr(catKey)}')" style="cursor:pointer">${escapeHtml(catLabel)}</span> ›
      <span>${escapeHtml(item.title)}</span>
    </div>
    <div class="detail">
      <h2>${escapeHtml(item.title)}</h2>
      ${body}
      <div class="actions">
        <button class="btn" onclick="copyItem('${escapeAttr(item.id)}')">📋 복사</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ==================== 사용 로그 (자동·익명) ====================
// 배포 가이드: google-apps-script/log_usage.gs 상단 주석 참고
// FLOW_LOG_URL 이 비어있으면 로깅 전부 noop (안전)
const FLOW_LOG_URL = 'https://script.google.com/macros/s/AKfycbwbsK_-ioR4mNhjTkBoucV_vxRcNm4PGvWknI9jJWvnbp2zQBAoh93hsQ0DW-TYKEzL/exec';
const FlowLog = (function() {
  let visitorId = '';
  let sessionId = '';
  let uaSummary = '';

  function _initIds() {
    try {
      visitorId = localStorage.getItem('flow_cs_visitor_id') || '';
      if (!visitorId) {
        visitorId = 'v-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36).slice(-4);
        localStorage.setItem('flow_cs_visitor_id', visitorId);
      }
    } catch (e) { visitorId = 'v-anon'; }
    sessionId = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    const ua = navigator.userAgent || '';
    const isMobile = /Mobi|Android|iPhone|iPad/i.test(ua);
    const browser = /Chrome\/[\d.]+/.exec(ua)?.[0] || /Safari\/[\d.]+/.exec(ua)?.[0] || 'Other';
    uaSummary = `${isMobile ? '모바일' : 'PC'}·${browser.split('/')[0]}`;
  }

  function send(event, data) {
    if (!FLOW_LOG_URL || FLOW_LOG_URL.includes('REPLACE_ME')) return;
    const payload = Object.assign({
      event,
      visitor_id: visitorId,
      session_id: sessionId,
      ua_summary: uaSummary,
      referrer: document.referrer || '',
    }, data || {});
    try {
      // fire-and-forget — 응답 안 기다림, 실패해도 UX 영향 없음
      fetch(FLOW_LOG_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload),
        keepalive: true,
      }).catch(() => {});
    } catch (e) {}
  }

  function init() {
    _initIds();
    send('visit', {});
  }

  return { init, send };
})();
// 페이지 로드 완료 후 자동 visit 기록
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => FlowLog.init());
} else {

async function copyText(text, triggerBtn, toastMsg) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e2) { ok = false; }
  }
  if (ok) {
    showCopyToast(toastMsg || '✓ 복사되었습니다');
    if (triggerBtn) {
      const original = triggerBtn.innerHTML;
      triggerBtn.classList.add('copied');
      triggerBtn.innerHTML = '✓ 복사됨';
      setTimeout(() => { triggerBtn.classList.remove('copied'); triggerBtn.innerHTML = original; }, 1500);
    }
  } else {
    showCopyToast('복사 실패 — 수동 복사 필요');
  }
  return ok;
}

function showCopyToast(msg) {
  let t = document.getElementById('copyToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'copyToast';
    t.className = 'copy-toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._copyToastTimer);
  window._copyToastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function copyItem(id) {
  const item = allItems().find(x => x.id === id);
  if (!item) return;
  let text = `${item.title}\n`;
  const c = item.content;
  if (c.markdown) {
    text += c.markdown;
  } else if (c.recommended || c.avoid) {
    text += `\n[권장 답변]\n${c.recommended || ''}\n\n[피해야 할 응대]\n${c.avoid || ''}`;
  } else {
    text += Object.entries(c).filter(([k,v]) => v).map(([k,v]) => `${k}: ${v}`).join('\n');
  }
  navigator.clipboard.writeText(text).then(() => alert('복사됨'));
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(text, query) {
  if (!text) return '';
  const safe = escapeHtml(text);
  if (!query) return safe;
  try {
    const re = new RegExp(escapeRegex(escapeHtml(query)), 'gi');
    return safe.replace(re, m => `<mark>${m}</mark>`);
  } catch { return safe; }
}

function onSearch(e) {

      const hits = searchLocal(text);

      try {

        addMsg('bot', `ℹ️ 「${info.campus}」의 ${catKo} 데이터는 등록되어 있지 않습니다.\n\n필요하시면 「자료 업데이트 요청」으로 등록을 부탁드리세요.`, null, 'no-campus');

      } else if (quality === 'weak') {
        // 매칭 약함 — 참고 데이터 + 업데이트 요청 안내 함께 (답변 신뢰도가 낮을 때만)

        const main = hits[0];

  // 답변 품질 판정: good / weak / none
  function evaluateAnswerQuality(query, hits) {
    if (!hits || hits.length === 0) return 'none';

    // 질문에서 2글자 이상의 의미 단어 추출 (불용어 제외)
    const stopwords = new Set(['알려줘','알려주세요','뭐야','무엇','어떻게','방법','주세요','입니다','주소','번호','연락처']);
    const keywords = query.split(/\s+/).filter(w => w.length >= 2 && !stopwords.has(w));
    if (keywords.length === 0) return 'good'; // 키워드 추출 불가 시 결과 신뢰

    const top = hits[0];
    const topText = (top.title + ' ' + (top.search_text || '') + ' ' + JSON.stringify(top.content || {})).toLowerCase();

    // 질문 키워드 중 몇 개가 결과에 포함되나? (부분 매칭 포함)
    const titleLower = (top.title || '').toLowerCase();
    let matched = 0;
    keywords.forEach(kw => {
      const k = kw.toLowerCase();
      if (topText.includes(k)) { matched += 1; return; }
      // 부분 매칭 — 접두사 2글자 ("재무팀" → "재무기획팀" title에 "재무" 포함) 0.7점
      if (k.length >= 3 && titleLower.includes(k.substring(0, 2))) { matched += 0.7; return; }
      // 더 완화된 부분 — 2글자라도 title에 있으면 0.5점
      if (k.length >= 2 && titleLower.includes(k.substring(0, 2))) matched += 0.5;
    });

    const matchRatio = matched / keywords.length;

    if (matchRatio >= 0.6) return 'good';   // 60% 이상 매칭
    if (matchRatio >= 0.3) return 'weak';   // 30~60%: 결과는 있지만 애매
    return 'none';                           // 30% 미만: 매칭 거의 없음
  }

  // 자료 없음 메시지 (업데이트 요청 안내 포함)
  function showNotFoundMessage(query) {
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1BVh2RxvQId82EeCQ7Yi8IIj8HOt4G1SpjbrtmzlEfpU/edit?gid=1234312928#gid=1234312928';
    const msg = `🔄 자료 업데이트 중입니다.

"${query}"에 대한 자료가 아직 등록되지 않았거나 업데이트 중입니다.

👉 필요한 자료가 있으시면 아래 링크에서 요청해 주세요:
📝 자료 업데이트 요청하기

(홈 화면 상단의 "연락처·수강료 데이터 편집" 버튼을 눌러 시트에 접속하신 뒤 「자료 업데이트 요청」 탭에 작성하시면 됩니다)`;

  // 로컬 검색 (의도 감지 → 카테고리 전용 검색 우선 → Fuse 전체 검색 폴백)
  function searchLocal(query) {
    if (!FUSE) return [];
    const q = query.trim();
    const intent = detectIntent(q);
    const limit = 10;

    const allHits = []; // {item, source, rank}
    const seen = new Set();
    const addHit = (item, source) => {
      if (!item || seen.has(item.id)) return;
      seen.add(item.id);
      allHits.push({ item, source });
    };

    // 1순위: intent.category 감지된 경우 그 카테고리 내 간단 매칭
    window._NO_CAMPUS_DATA = null; // 리셋
    if (intent.category && DATA[intent.category]) {
      // adminSub 지정된 경우 (수익코드·반형태) 해당 서브카테고리만 필터
      let pool = DATA[intent.category];
      // files 카테고리는 allItems 변환 형태로 사용 (drive_url 등 메타 유지)
      if (intent.category === 'files') {
        pool = allItems().filter(x => x.category === 'files');
      }
      if (intent.adminSub) {
        pool = pool.filter(item => (item.subcategory || '').startsWith(intent.adminSub + '.'));
      }

      // 🔒 캠퍼스 미매칭 폴백 — files 카테고리는 campus 필드 없음 → 제외
      // (파일은 공통 자료라서 캠퍼스 선필터로 걸러내면 잘못된 "없음" 안내가 뜸)
      if (intent.campus && intent.category !== 'files') {
        const campusPool = pool.filter(item =>
          item.campus === intent.campus ||
          (item.content && item.content.캠퍼스 && String(item.content.캠퍼스).includes(intent.campus))
        );
        if (campusPool.length === 0) {
          window._NO_CAMPUS_DATA = { campus: intent.campus, category: intent.category };
          return []; // Fuse 폴백도 돌지 않음 — 치명 오답(정자 수강료→수내) 차단
        }
        pool = campusPool;
      }

      // 키워드에서 "수익코드"·"반형태" 등 메타 단어 제거 (고유번호·캠퍼스·브랜드 등 핵심만)
      const metaWords = /수익코드|반형태|코드|고유번호|구분|담당자|내선|전화|직통|연락처|주소|위치|어디|알려줘|주세요|뭐야|무엇|어떻게/g;
      const q2 = q.replace(metaWords, ' ').trim();
      const keywords = q2.split(/\s+/).filter(w => w.length >= 1);

      // 🔎 pool 내 Fuse 재검색 (부분 매칭 — "재무팀" → "재무기획팀" 자동 매칭)
      const poolFuse = new Fuse(pool, {
        keys: [{name:'title', weight:3}, {name:'search_text', weight:2}, {name:'tags', weight:1}],
        threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2, includeScore: true,
      });
      const poolHits = poolFuse.search(q2 || q, { limit: 10 });

      // keyword scoring + Fuse 결합
      const fuseScoreMap = new Map();
      poolHits.forEach(h => fuseScoreMap.set(h.item.id, 1 - (h.score || 0)));

      const scored = pool.map(item => {
        const text = (item.title + ' ' + (item.search_text || '') + ' ' + JSON.stringify(item.content || {})).toLowerCase();
        const titleLower = (item.title || '').toLowerCase();
        let score = 0;
        keywords.forEach(kw => {
          const k = kw.toLowerCase();
          if (text.includes(k)) {
            score += 1;
            // 제목 완전 포함이면 +1 추가
            if (titleLower.includes(k)) score += 1;
          } else if (k.length >= 3) {
            // 부분 매칭 — 접두사 2글자가 제목에 있으면 큰 가중치 ("재무팀" → "재무기획팀")
            const prefix = k.substring(0, 2);
            if (titleLower.includes(prefix)) score += 1.5;
            else if (text.includes(prefix)) score += 0.5;
          } else if (k.length === 2 && titleLower.includes(k)) {
            // 2글자 키워드도 title 포함이면 보너스
            score += 0.5;
          }
        });
        // Fuse 매칭도 반영 (fuzzy / 부분 매칭)
        score += (fuseScoreMap.get(item.id) || 0) * 2;
        // 캠퍼스 매칭 가중치
        if (intent.campus && item.campus === intent.campus) score += 3;
        if (intent.campus && item.content && item.content.캠퍼스 && String(item.content.캠퍼스).includes(intent.campus)) score += 3;
        return { item, score };
      }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);
      scored.slice(0, 5).forEach(x => addHit(x.item, 'intent-category'));
    }

    // 2순위: Fuse 전체 검색 (오타·관련어 포함)
    FUSE.search(q, { limit }).forEach(h => addHit(h.item, 'fuse-original'));

    // 3순위: 불용어 제거 후 재검색
    if (allHits.length < 3) {
      const cleaned = cleanQuery(q);
      if (cleaned && cleaned !== q) {
        FUSE.search(cleaned, { limit }).forEach(h => addHit(h.item, 'fuse-cleaned'));
      }
    }

    // 4순위: 캠퍼스+관 핵심 키워드로 재검색
    if (allHits.length < 3) {
      const keywords = extractCoreKeywords(q);
      if (keywords) {
        FUSE.search(keywords, { limit }).forEach(h => addHit(h.item, 'fuse-keywords'));
      }
    }

    // source 우선순위 정렬 (intent-category가 Fuse 전체 폴백보다 상위)
    const srcOrder = { 'intent-category': 0, 'fuse-original': 1, 'fuse-cleaned': 2, 'fuse-keywords': 3 };
    allHits.sort((a, b) => (srcOrder[a.source] ?? 9) - (srcOrder[b.source] ?? 9));
    let hits = allHits.map(x => x.item);

    // intent.campus 매칭 가중치 — files 카테고리 질의는 제외 (파일에는 campus 필드 없음)
    if (intent.campus && intent.category !== 'files') {
      hits.sort((a, b) => {
        const aC = (a.campus === intent.campus) ? -1 : 1;
        const bC = (b.campus === intent.campus) ? -1 : 1;
        return aC - bC;
      });
    }

    return hits.slice(0, 5);
  }

  // 쿼리에서 불용어 제거
  function cleanQuery(q) {
    const stopwords = /(알려줘|알려주세요|뭐야|무엇이|무엇|어떻게|방법|어디야|어디|에요|인가요|주세요|입니다|있어|있나|주소|전화번호|연락처|번호|가격|비용|얼마|좀|의|를|을|이|가|은|는)/g;
    return q.replace(stopwords, ' ').replace(/\s+/g, ' ').trim();
  }

  // 캠퍼스 + 관 핵심 키워드만 추출
  function extractCoreKeywords(q) {
    const campuses = ['이매', '수내', '수지', '광교', '영통', '정자', '본사'];
    const gwans = ['초등', '중등', '고등', '영재', '사이언스카이', '사스', '테디', '더블랙'];
    const found = [];
    campuses.forEach(c => { if (q.includes(c)) found.push(c); });
    gwans.forEach(g => { if (q.includes(g)) found.push(g); });
    return found.join(' ');
  }

  // 질문 의도 감지 (키워드 기반)
  // 🪝 특수 질의 핸들러 (인삿말·도움말·감정·무의미 질의)
  // 반환 true: send()가 즉시 종료 (addMsg 이미 호출됨)
  function handleSpecialQuery(q) {
    const t = (q || '').trim();
    // 1) 무의미 질의: 2글자 미만 or 한글 음절/영숫자 섞인 쓰레기 패턴
    //    (예: "ㄱㄱ", "ㅋㅋㅋ", "aaa", "123", "...")
    if (t.length < 2) {
      addMsg('bot', '질문을 조금 더 자세히 입력해 주세요. 예: "광교 중등관 담당자", "수내 초등 수강료", "사업자등록증"', null, 'tip');
      return true;
    }
    if (/^[ㄱ-ㅎㅏ-ㅣ\s]+$/.test(t) || /^[a-zA-Z]{1,4}$/.test(t) || /^\d+$/.test(t)) {
      addMsg('bot', '질문을 완성된 단어로 입력해 주세요. 예: "환불 응대", "본사 인사기획팀", "플로우교육 사업자등록증"', null, 'tip');
      return true;
    }
    // 2) 인삿말·도움말
    if (/^(안녕|hi|hello|헬로|도움말|help|사용법|뭐야|뭐할수있어|사용방법|가이드)/.test(t)) {
      const msg = `안녕하세요! Flow CS Hub 챗봇입니다 🤝

이렇게 질문해 주세요:
• 캠퍼스/담당자 — "광교 중등관 담당자", "수내 초등 직통번호"
• 수강료 — "수내 중등 사아 수강료", "26년 수강료"
• 매뉴얼 — "환불 응대", "비즈메카", "교육청 강사 등록"
• 수익코드 — "수익코드 광교 초등"
• 행정자료 — "플로우교육 사업자등록증", "학원운영등록증"

데이터에 없으면 "자료 업데이트 요청"으로 안내드립니다.`;
      addMsg('bot', msg, null, 'help');
      return true;
    }
    // 3) 감정/학부모 역할 시뮬레이션
    if (/비싸|비쌉|비쌈|불만|화나|짜증|환불\s*해\s*줘|돈|너무/.test(t)) {
      addMsg('bot', '학부모 응대 상황이신가요? 아래 매뉴얼을 참고해주세요.', null, 'guide');
      // 그대로 흘려서 parent_response/환불 매뉴얼 검색 결과 보이도록 return false
      return false;
    }
    return false;
  }

  // 담당자명 자동 사전 (최초 1회 캐싱) — contacts.content.담당자에서 추출
  let CONTACT_NAMES_CACHE = null;
  function getContactNames() {
    if (CONTACT_NAMES_CACHE) return CONTACT_NAMES_CACHE;
    const names = new Set();
    const TITLE = /(부원장|팀장|과장|대리|주임|사원|선생님|선생|부장|차장|이사|대표|실장|관장|원장|소장|상담사|코디|팀|과)/;
    (DATA.contacts || []).forEach(c => {
      const raw = c.content && c.content.담당자 ? c.content.담당자 : '';
      if (!raw) return;
      // "조연희팀장(대리) · 박병우대리 (내선 9702)" → 각 조각에서 직급어 앞 이름 추출
      raw.replace(/\([^)]*\)/g, '').split(/[·,、/]/).forEach(part => {
        const t = part.trim();
        if (!t) return;
        const splitIdx = t.search(TITLE);
        const nameCand = splitIdx > 0 ? t.slice(0, splitIdx).trim() : t;
        if (/^[가-힣]{2,4}$/.test(nameCand)) names.add(nameCand);
      });
    });
    CONTACT_NAMES_CACHE = Array.from(names);
    return CONTACT_NAMES_CACHE;
  }

  function detectIntent(q) {
    const intent = { category: null, campus: null, adminSub: null };

    // ⭐ 파일/행정자료 다운로드 요청 (최우선)
    // 공식 파일명 패턴도 포함: 제N학원, N타워, N빌딩, 학원운영등록증, 등록증, pdf, 메이플라워 등
    if (/파일|자료\s*(다운|주세요|찾)|다운\s*(로드|받)|사업자등록|사업자\s*등록|증빙|양식|템플릿|로고|CI|BI|심볼|서식|업로드|문서\s*파일|PDF|엑셀\s*파일|한글\s*파일|다운받|제\s*\d+\s*학원|\d+\s*타워|\d+\s*빌딩|엔타워|N타워|학원운영등록증|학원\s*등록증|등록증\s*파일|메이플라워|플로우교육|풍해빌딩|다운타운|엔타워|한화빌딩|금강프라자|정민빌딩|셔틀|노선표|노선|시간표|운행|버스/i.test(q)) {
      intent.category = 'files';
    }
    // ⭐ admin 하위 특수 서브카테고리 우선 체크 (수익코드·반형태)
    else if (/수익코드|수익\s*구분|코드\s*번호/.test(q)) {
      intent.category = 'admin';
      intent.adminSub = 'Ⅳ';  // Ⅳ. 수익코드
    } else if (/반형태|반\s*구분|고유\s*번호|관리자/.test(q)) {
      intent.category = 'admin';
      intent.adminSub = 'Ⅲ';  // Ⅲ. 반형태 · 수익구분
    }
    // 그 외 카테고리 힌트
    // 'tuition': "원" 1글자 매칭 금지 → 숫자+원 또는 "수강료"·"비용"·"가격"·"얼마" 명시어 필요
    else if (/수강료|학원비|강습비|가격|얼마|비용(?!의)|\d\s*만?\s*원|원\s*인상/.test(q)) intent.category = 'tuition';
    else if (/담당자|내선|전화|직통|연락처|주소|위치|어디|부원장|팀장|과장|대리|주임|사원|선생님|기획팀|인사팀|재무팀|총무팀|법무팀|관리팀|경영관리|경영본부|사업부|본부|부서|팀$|팀\s|팀[\?!\.]|팀의/.test(q)) intent.category = 'contacts';
    // 담당자명 사전 매칭 (고수정·조병룡 등 이름만 입력해도 contacts로 유도)
    else if (getContactNames().some(name => q.includes(name))) intent.category = 'contacts';
    else if (/응대|스크립트|환불|클레임|문의|대응/.test(q)) intent.category = 'parent_response';
    else if (/감탄|친절|응대 매뉴얼/.test(q)) intent.category = 'cs_appreciation';
    else if (/매뉴얼|절차|방법|어떻게|등록|아카|비즈메카|교육청/.test(q)) intent.category = 'admin';

    // 캠퍼스 힌트
    const campuses = ['이매', '수내', '수지', '광교', '영통', '정자', '본사', '잠실'];
    for (const c of campuses) {
      if (q.includes(c)) { intent.campus = c; break; }
    }

    return intent;
  }

  // ⭐ 카테고리별 답변 템플릿 ⭐
  function formatAnswer(item) {
    const cat = item.category;
    const c = item.content || {};

    if (cat === 'contacts') return formatContact(item, c);
    if (cat === 'tuition') return formatTuition(item, c);
    if (cat === 'admin') return formatAdmin(item, c);
    if (cat === 'parent_response' || cat === 'parent-response') return formatParentResponse(item, c);
    if (cat === 'cs_appreciation' || cat === 'cs-appreciation') return formatCSAppreciation(item, c);
    if (cat === 'campus_guide' || cat === 'campus-guide') return formatCampusGuide(item, c);
    if (cat === 'files') return formatFile(item);
    return `${item.title}\n\n${Object.entries(c).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n')}`;
  }

  function formatFile(item) {
    const lines = [];
    // DATA.files 원본에서 추가 메타 조회
    const raw = (DATA.files || []).find(f => f.id === item.id || ('file-' + (f.id || '')) === item.id);
    const fileType = raw && raw.file_type ? raw.file_type : '';
    const updated = raw && raw.updated ? raw.updated : '';
    lines.push(`📄 ${item.title}`);
    const meta = [];
    if (item.subcategory) meta.push(`🏷️ ${item.subcategory}`);
    if (fileType) meta.push(`📎 ${fileType}`);
    if (updated) meta.push(`📅 ${updated}`);
    if (meta.length) lines.push(meta.join('  ·  '));
    if (item.content) { lines.push(''); lines.push(item.content); }
    return lines.join('\n');
  }

  function formatContact(item, c) {
    const lines = [];
    const icon = item.subcategory === '본사' ? '🏛️' : (item.subcategory === '캠퍼스 대표' ? '🏢' : '📍');
    lines.push(`${icon} ${item.title}`);
    lines.push('');

    if (c.직통번호 && c.직통번호 !== c.대표번호) lines.push(`📞 직통: ${c.직통번호}`);
    if (c.대표번호) lines.push(`📞 대표번호: ${c.대표번호}`);
    if (c.담당자) {
      lines.push('');
      lines.push(`👤 담당자:`);
      // 괄호 내부 "·"와 구분자 "·"를 분리:
      // ") · " 또는 "] · " 패턴만 담당자 구분자로 간주
      let persons;
      if (/\)\s·\s|\]\s·\s/.test(c.담당자)) {
        persons = c.담당자.split(/(?<=[\)\]])\s·\s/);
      } else {
        persons = c.담당자.split(/\s·\s/);
      }
      persons.forEach(p => lines.push(`  • ${p.trim()}`));
    }
    if (c.내선 && !c.담당자) lines.push(`📱 내선: ${c.내선}`);
    if (c.위치) {
      lines.push('');
      lines.push(`📍 위치: ${c.위치}`);
    }
    if (c.학원등록번호) lines.push(`🏫 학원등록: ${c.학원등록번호}`);
    if (c.비고) {
      lines.push('');
      lines.push(`💡 ${c.비고}`);
    }
    return lines.join('\n');
  }

  function formatTuition(item, c) {
    const lines = [];
    lines.push(`💰 ${item.title}`);
    lines.push('');
    if (c['26년_수강료']) {
      lines.push(`▶ 26년 수강료: ${c['26년_수강료'].toLocaleString()}원`);
    }
    if (c['25년_수강료'] && c.인상액 != null) {
      const up = c.인상액;
      if (up > 0) {
        lines.push(`   25년 대비 ↑ ${up.toLocaleString()}원 인상`);
        lines.push(`   (25년: ${c['25년_수강료'].toLocaleString()}원)`);
      } else if (up < 0) {
        lines.push(`   25년 대비 ↓ ${Math.abs(up).toLocaleString()}원 인하`);
        lines.push(`   (25년: ${c['25년_수강료'].toLocaleString()}원)`);
      } else {
        lines.push(`   25년과 동일: ${c['25년_수강료'].toLocaleString()}원`);
      }
    }
    lines.push('');
    const spec = [];
    if (c.브랜드) spec.push(`브랜드: ${c.브랜드}`);
    if (c.회당) spec.push(`회당: ${c.회당}`);
    if (c.과정) spec.push(`과정: ${c.과정}`);
    if (c.사업부) spec.push(`사업부: ${c.사업부}`);
    if (spec.length) lines.push(spec.join(' · '));
    if (c.비고) {
      lines.push('');
      lines.push(`💡 ${c.비고}`);
    }
    return lines.join('\n');
  }

  function formatAdmin(item, c) {
    const lines = [];
    lines.push(`📖 ${item.title}`);
    if (item.subcategory) lines.push(`[${item.subcategory}]`);
    lines.push('');

    // 반형태/수익코드
    if (c.고유번호) {
      lines.push(`▶ 고유번호: ${c.고유번호}`);
      if (c.교육관) lines.push(`교육관: ${c.교육관}`);
      if (c.브랜드) lines.push(`브랜드: ${c.브랜드}`);
      if (c.캠퍼스) lines.push(`캠퍼스: ${c.캠퍼스}`);
      if (c.반형태) {
        lines.push('');
        lines.push(`📝 반형태:\n${c.반형태}`);
      }
      if (c['담당 CS']) lines.push(`\n👤 담당 CS: ${c['담당 CS']}`);
      if (c.건물명) lines.push(`🏢 ${c.건물명}${c.층수 ? ' ' + c.층수 : ''}`);
      if (c.학원등록번호) lines.push(`🏫 ${c.학원등록번호}`);
      if (c.수익경로) lines.push(`\n💼 수익경로: ${c.수익경로}`);
      return lines.join('\n');
    }

    // 일반 매뉴얼
    if (c.본문) {
      const body = c.본문.length > 500 ? c.본문.substring(0, 500) + '...\n\n(상세는 "📖 매뉴얼" 메뉴에서 확인)' : c.본문;
      lines.push(body);
    } else if (c.markdown) {
      const md = c.markdown.length > 500 ? c.markdown.substring(0, 500) + '...' : c.markdown;
      lines.push(md);
    }
    return lines.join('\n');
  }

  function formatParentResponse(item, c) {
    const lines = [];
    lines.push(`💬 ${item.title}`);
    if (item.subcategory) lines.push(`[${item.subcategory}]`);
    lines.push('');
    if (c.markdown) {
      const md = c.markdown.length > 600 ? c.markdown.substring(0, 600) + '...' : c.markdown;
      lines.push(md);
    }
    if (c.recommended) {
      lines.push('');
      lines.push(`✅ 권장 응대:`);
      lines.push(c.recommended);
    }
    if (c.avoid) {
      lines.push('');
      lines.push(`❌ 피해야 할 응대:`);
      lines.push(c.avoid);
    }
    return lines.join('\n');
  }

  function formatCSAppreciation(item, c) {
    return formatParentResponse(item, c).replace('💬', '⭐');
  }

  function formatCampusGuide(item, c) {
    return formatParentResponse(item, c).replace('💬', '🏫');
  }

  // 초기화
  async function init() {
    await loadConfig();
  }

  return { toggle, clear, send, ask, init };
})();

// ==================== 시작 ====================
loadData().then(() => {
  FlowBot.init();
  setupChatbotLayout();
});

// 챗봇: 데스크톱 ≥1025 → 오른쪽 패널로 도킹 / 그 미만 → 플로팅 FAB
function setupChatbotLayout() {
  const win = document.getElementById('flow-bot-window');
  const panel = document.getElementById('chatbotPanel');
  const fab = document.getElementById('flow-bot-fab');
  const badge = document.getElementById('flow-bot-fab-badge');
  if (!win || !panel) return;
  const isDesktop = window.matchMedia('(min-width: 1025px)').matches;
  if (isDesktop) {
    if (win.parentElement !== panel) panel.appendChild(win);
    win.classList.add('open', 'docked');
    if (fab) fab.style.display = 'none';
    if (badge) badge.style.display = 'none';
  } else {
    if (win.parentElement !== document.body) document.body.appendChild(win);
    win.classList.remove('docked');
    if (fab) fab.style.display = '';
    if (badge) badge.style.display = '';
  }
}
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(setupChatbotLayout, 150);
});
</script>
