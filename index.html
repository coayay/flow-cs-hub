<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1e3a5f;
  --primary-light: #2c5282;
  --accent: #0f766e;
  --sand: #d9b66f;
  --bg: #f7f4ee;
  --paper: #ffffff;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --hover: #f0ede5;
  --active: #dcf1ed;
  --shadow: 0 4px 12px rgba(31,41,55,0.06);
}
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
}
/* 상단 헤더 */
.header {
  position: sticky; top: 0; z-index: 10;
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px;
  box-shadow: var(--shadow);
}
.logo {
  font-size: 18px; font-weight: 800; color: var(--primary);
  cursor: pointer; white-space: nowrap;
}
.logo span { color: var(--accent); }
.search-wrap {
  flex: 1; max-width: 600px; position: relative;
}
.search-input {
  width: 100%; padding: 10px 16px 10px 40px;
  border: 1px solid var(--line); border-radius: 999px;
  font-size: 14px; background: #fafafa;
  transition: all 0.15s;
}
.search-input:focus {
  outline: none; border-color: var(--accent);
  background: white; box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
}
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); color: var(--muted);
}
.header-actions { display: flex; gap: 10px; color: var(--muted); }
/* 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: calc(100vh - 60px);
}
/* 사이드바 */
.sidebar {
  background: white;
  border-right: 1px solid var(--line);

  overflow-y: auto;

.sidebar-section {

.sidebar-title {
  padding: 8px 20px;

}
.sidebar-item {

}
.sidebar-item:hover { background: var(--hover); }
.sidebar-item.active {

}

<script>
// ==================== 데이터 로드 ====================
let DATA = { contacts: [], tuition: [], admin: [], parent_response: [], cs_appreciation: [], campus_guide: [], meta: null };
let FUSE = null;  // Fuse.js 인스턴스 (전체 검색)

/* 한글 초성 추출 (예: "광교 초등관" → "ㄱㄱ ㅊㄷㄱ") */
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(s) {
  if (!s) return '';
  return String(s).split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) return CHOSUNG[Math.floor(code / 588)];
    return ch;
  }).join('');
}
function isChosungQuery(q) {
  // 쿼리에 자모 문자만 있으면 초성 검색으로 판단
  return /^[ㄱ-ㅎ\s]+$/.test(q);
}

/* Google Sheet CSV → JSON 변환 (연락처) */
function csvToContacts(rows) {
  return rows.filter(r => r.id).map(r => ({
    id: r.id,
    category: "contacts",
    subcategory: r['분류'] || '',
    campus: r['캠퍼스'] || '',
    gwan: r['관/시설'] || '',
    title: `${r['캠퍼스']||''} ${r['관/시설']||''}`.trim(),
    content: {
      "직통번호": r['직통번호'] || '',
      "대표번호": r['대표번호'] || '',
      "위치": r['위치'] || '',
      "비고": r['비고'] || '',
    },
    tags: [r['캠퍼스']||'', r['관/시설']||'', '연락처'].filter(Boolean),
    search_text: [r['캠퍼스'], r['관/시설'], r['직통번호'], r['대표번호'], r['위치'], r['비고']].filter(Boolean).join(' '),
    related: [],
    updated: new Date().toISOString().slice(0, 10),
    _source: 'google-sheet',
  }));
}

/* Google Sheet CSV → JSON 변환 (수강료) */
function csvToTuition(rows) {
  return rows.filter(r => r.id).map(r => {
    const y25 = r['25년_수강료'] ? parseInt(String(r['25년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const y26 = r['26년_수강료'] ? parseInt(String(r['26년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const up = (y25 && y26) ? y26 - y25 : 0;
    return {
      id: r.id,
      category: "tuition",
      subcategory: r['구분'] || '',
      campus: r['캠퍼스'] || '',
      gwan: `${r['사업부']||''} ${r['브랜드']||''}`.trim(),
      title: `${r['캠퍼스']||''} ${r['구분']||''} ${r['회당']||''} ${r['과정']||''}`.replace(/\s+/g, ' ').trim(),
      content: {
        "사업부": r['사업부'] || '',
        "브랜드": r['브랜드'] || '',
        "회당": r['회당'] || '',
        "과정": r['과정'] || '',
        "25년_수강료": y25,
        "26년_수강료": y26,
        "비고": r['비고'] || '',
        "인상액": up,
      },
      tags: [r['캠퍼스'], r['구분'], r['사업부'], r['브랜드'], r['회당'], r['과정'], '수강료'].filter(Boolean),
      search_text: [r['캠퍼스'], r['구분'], r['사업부'], r['브랜드'], r['회당'], r['과정'], y26 ? y26+'원' : '', r['비고']].filter(Boolean).join(' '),
      related: [],
      updated: new Date().toISOString().slice(0, 10),
      _source: 'google-sheet',
    };
  });
}

/* Google Sheet CSV 로드 (실패 시 null) */
async function fetchSheetCSV(url) {
  if (!url || !/^https?:\/\//.test(url)) return null;
  try {
    // 캐시 무효화용 timestamp
    const sep = url.includes('?') ? '&' : '?';
    const bustUrl = url + sep + '_ts=' + Math.floor(Date.now() / 60000); // 1분 캐시
    const res = await fetch(bustUrl);
    if (!res.ok) return null;
    const text = await res.text();
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    if (parsed.errors.length && !parsed.data.length) return null;
    return parsed.data;
  } catch (e) {
    console.warn('시트 로드 실패, 로컬 JSON 사용:', e);
    return null;
  }
}

async function loadData() {
  // 시트 설정 먼저 로드
  let sheetConfig = { contacts_csv_url: '', tuition_csv_url: '' };
  try {
    sheetConfig = await fetch('data/sheet-config.json?_ts=' + Math.floor(Date.now() / 60000)).then(r => r.json());
  } catch {}

  const [c_local, t_local, a, pr, ca, cg, m, c_sheet, t_sheet] = await Promise.all([
    fetch('data/contacts.json').then(r => r.json()),
    fetch('data/tuition.json').then(r => r.json()),
    fetch('data/admin.json').then(r => r.json()),
    fetch('data/parent-response.json').then(r => r.json()).catch(() => []),
    fetch('data/cs-appreciation.json').then(r => r.json()).catch(() => []),
    fetch('data/campus-guide.json').then(r => r.json()).catch(() => []),
    fetch('data/meta.json').then(r => r.json()),
    fetchSheetCSV(sheetConfig.contacts_csv_url),
    fetchSheetCSV(sheetConfig.tuition_csv_url),
  ]);

  // 시트 데이터 있으면 우선 사용, 없으면 로컬
  const c = (c_sheet && c_sheet.length) ? csvToContacts(c_sheet) : c_local;
  const t = (t_sheet && t_sheet.length) ? csvToTuition(t_sheet) : t_local;

  DATA.contacts = c; DATA.tuition = t; DATA.admin = a;
  DATA.parent_response = pr; DATA.cs_appreciation = ca; DATA.campus_guide = cg; DATA.meta = m;

  // 데이터 소스 배지
  const sourceInfo = document.getElementById('sourceInfo');
  if (sourceInfo) {
    const cSrc = (c_sheet && c_sheet.length) ? '🟢 시트' : '📄 로컬';
    const tSrc = (t_sheet && t_sheet.length) ? '🟢 시트' : '📄 로컬';
    sourceInfo.textContent = `연락처 ${cSrc} · 수강료 ${tSrc}`;
  }

  // 초성 필드 자동 추가
  const all = [...c, ...t, ...a, ...pr, ...ca, ...cg];
  all.forEach(item => {
    item.chosung_text = toChosung(item.search_text || '') + ' ' + toChosung(item.title || '');
  });

  // Fuse.js 인스턴스 (오타 허용 + 다중 필드)
  FUSE = new Fuse(all, {
    keys: [
      { name: 'title',        weight: 3 },
      { name: 'search_text',  weight: 2 },
      { name: 'tags',         weight: 1.5 },
      { name: 'chosung_text', weight: 1 },
    ],
    threshold: 0.35,      // 0(엄격) ~ 1(관대). 오타 허용도
    ignoreLocation: true, // 문장 위치 무관
    minMatchCharLength: 1,
    includeScore: true,
  });

  renderSidebar();
  renderRoute();
}

let CURRENT = { page: 'home', category: null, subcategory: null, itemId: null };

function goHome() { location.hash = ''; closeSidebar(); }
function goCategory(cat, sub) {
  location.hash = sub ? `#/${cat}/${encodeURIComponent(sub)}` : `#/${cat}`;
  closeSidebar();
}
function goDetail(id) {
  location.hash = `#/detail/${id}`;
  closeSidebar();
}
/* 모바일 사이드바 토글 */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  const open = sb.classList.toggle('mobile-open');
  bd.classList.toggle('show', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  sb.classList.remove('mobile-open');
  bd.classList.remove('show');
  document.body.style.overflow = '';
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { page: 'home' };
  const parts = h.split('/').map(decodeURIComponent);
  if (parts[0] === 'detail') return { page: 'detail', itemId: parts[1] };
  return {
    page: 'category',
    category: parts[0],
    subcategory: parts[1] || null,
  };
}

function renderRoute() {
  CURRENT = parseHash();
  renderSidebar(); // active 상태 갱신
  if (CURRENT.page === 'home') renderHome();
  else if (CURRENT.page === 'category') renderCategory();
  else if (CURRENT.page === 'detail') renderDetail();
}
window.addEventListener('hashchange', renderRoute);

/* 간단 마크다운 렌더러 */
function renderMarkdown(md) {
  if (!md) return '';
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = escape(md);
  // 헤딩
  out = out.replace(/^## (.+)$/gm, '<h3 class="md-h3">$1</h3>');
  out = out.replace(/^# (.+)$/gm, '<h2 class="md-h2">$1</h2>');
  // 볼드
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 리스트 (- 로 시작)
  out = out.replace(/(?:^- .+(?:\n|$))+/gm, block => {
    const items = block.trim().split('\n').map(l => l.replace(/^- /, '').trim());
    return '<ul class="md-ul">' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
  });
  // 문단 (빈 줄로 구분)
  out = out.split(/\n\n+/).map(p => {
    if (p.match(/^<(h2|h3|ul)/)) return p;
    return `<p class="md-p">${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return out;
}

function renderDetail() {

  let body = '';

  // 학부모 응대 · CS 감탄 · 캠퍼스별 상담자료 (markdown 또는 recommended/avoid)
  if (item.category === 'parent-response' || item.category === 'parent_response' ||
      item.category === 'cs-appreciation' || item.category === 'cs_appreciation' ||
      item.category === 'campus-guide' || item.category === 'campus_guide') {
    const c = item.content;
    let parts = [];
    if (c.markdown) {
      parts.push(`<div class="md-body">${renderMarkdown(c.markdown)}</div>`);
    }
    if (c.recommended) {
      parts.push(`
        <div class="response-block ok">
          <div class="response-label">✅ 권장 답변</div>
          <div class="response-text">${escapeHtml(c.recommended).replace(/\n/g, '<br>')}</div>
        </div>
      `);
    }
    if (c.avoid) {
      parts.push(`
        <div class="response-block ng">
          <div class="response-label">❌ 피해야 할 응대</div>
          <div class="response-text">${escapeHtml(c.avoid).replace(/\n/g, '<br>')}</div>
        </div>
      `);
    }
    body = parts.join('');
  } else if (item.category === 'admin' && item.content && item.content.markdown) {
    // 행정 매뉴얼: markdown 필드 있으면 원문 렌더링
    body = `<div class="md-body">${renderMarkdown(item.content.markdown)}</div>`;
  } else {
    // 기존 contacts / tuition
    const rows = Object.entries(item.content).filter(([k,v]) => v).map(([k,v]) => `
      <dt>${k}</dt>
      <dd>${typeof v === 'number' ? v.toLocaleString() + (k.includes('수강료') || k.includes('인상액') ? '원' : '') : v}</dd>
    `).join('');
    body = `<dl>${rows}</dl>`;
  }

  const catLabel = catInfo ? catInfo.label : item.category;
  const catKey = catInfo ? catInfo.key : item.category;

  m.innerHTML = `
    <div class="breadcrumb">
      <span onclick="goHome()" style="cursor:pointer">홈</span> ›
      <span onclick="goCategory('${catKey}')" style="cursor:pointer">${catLabel}</span> ›
      <span>${item.title}</span>

      <h2>${item.title}</h2>

      <div class="actions">
        <button class="btn" onclick="copyItem('${item.id}')">📋 복사</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyItem(id) {
  const item = allItems().find(x => x.id === id);
  if (!item) return;
  let text = `${item.title}\n`;
  const c = item.content;
  if (c.markdown) {
    text += c.markdown;
  } else if (c.recommended || c.avoid) {
    text += `\n[권장 답변]\n${c.recommended || ''}\n\n[피해야 할 응대]\n${c.avoid || ''}`;
  } else {
    text += Object.entries(c).filter(([k,v]) => v).map(([k,v]) => `${k}: ${v}`).join('\n');
  }
  navigator.clipboard.writeText(text).then(() => alert('복사됨'));
}

// ==================== 검색 (Fuse.js + 초성 지원) ====================
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(text, query) {
  if (!text || !query) return text || '';
  try {
    const re = new RegExp(escapeRegex(query), 'gi');
    return text.replace(re, m => `<mark>${m}</mark>`);
  } catch { return text; }
}

function onSearch(e) {
  const raw = e.target.value.trim();
  const box = document.getElementById('searchResults');
  if (!raw || !FUSE) { box.classList.remove('open'); return; }

  // 초성 쿼리 판별해 검색어 변환
  const chosungMode = isChosungQuery(raw);
  const query = raw; // Fuse에 그대로 전달 (다중 필드 매칭)

  const hits = FUSE.search(query, { limit: 40 });
  const results = hits.map(h => h.item);

  if (results.length === 0) {
    box.innerHTML = `<div class="search-empty">검색 결과 없음<br><span style="font-size:11px;color:var(--muted);">오타·초성(ㄱㄱ ㅊㄷ)도 지원합니다</span></div>`;
    box.classList.add('open'); return;
  }

  // 그룹핑
  const grouped = { contacts: [], tuition: [], admin: [], parent_response: [], cs_appreciation: [], campus_guide: [] };
  results.forEach(r => {
    const k = (r.category || '').replace('-','_');
    if (grouped[k]) grouped[k].push(r);
  });
  const catLabel = {
    contacts: '🏢 캠퍼스 정보',
    tuition: '💰 수강료',
    admin: '📖 행정 매뉴얼',
    parent_response: '💬 학부모 응대 매뉴얼',
    cs_appreciation: '⭐ CS 감탄 매뉴얼',
    campus_guide: '🏫 캠퍼스별 상담자료'
  };

  box.innerHTML = Object.entries(grouped).filter(([k,v]) => v.length).map(([k,v]) => `
    <div class="search-group-title">${catLabel[k]} (${v.length}건)</div>
    ${v.slice(0, 8).map(item => {
      const title = chosungMode ? item.title : highlightText(item.title, raw);
      return `<div class="search-item" onclick="goDetail('${item.id}'); hideSearchResults();">
        ${title}
        <span style="color:var(--muted); font-size:11px; margin-left:6px;">
          ${item.campus || item.subcategory || ''}
        </span>
      </div>`;
    }).join('')}
  `).join('') + `<div style="padding:8px 12px; font-size:11px; color:var(--muted); border-top:1px solid var(--line);">
    총 ${results.length}건 · Enter로 전체 결과 · 오타/초성(ㄱㄱ) 지원
  </div>`;
  box.classList.add('open');
}
function hideSearchResults() {
  document.getElementById('searchResults').classList.remove('open');
}
// Ctrl+K 단축키
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') hideSearchResults();
});

// ==================== 시작 ====================
loadData();
</script>
</body>
</html>
