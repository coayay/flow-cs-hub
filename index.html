<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>Flow CS Hub · CS 직원 전용</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1e3a5f;
  --primary-light: #2c5282;
  --accent: #0f766e;
  --sand: #d9b66f;
  --bg: #f7f4ee;
  --paper: #ffffff;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --hover: #f0ede5;
  --active: #dcf1ed;
  --shadow: 0 4px 12px rgba(31,41,55,0.06);
}
body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
}
/* 상단 헤더 */
.header {
  position: sticky; top: 0; z-index: 10;
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 20px;
  box-shadow: var(--shadow);
}
.logo {
  font-size: 18px; font-weight: 800; color: var(--primary);
  cursor: pointer; white-space: nowrap;
}
.logo span { color: var(--accent); }
.search-wrap {
  flex: 1; max-width: 600px; position: relative;
}
.search-input {
  width: 100%; padding: 10px 16px 10px 40px;
  border: 1px solid var(--line); border-radius: 999px;
  font-size: 14px; background: #fafafa;
  transition: all 0.15s;
}
.search-input:focus {
  outline: none; border-color: var(--accent);
  background: white; box-shadow: 0 0 0 3px rgba(15,118,110,0.1);
}
.search-icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%); color: var(--muted);
}
.header-actions { display: flex; gap: 10px; color: var(--muted); }
/* 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: calc(100vh - 60px);
}
/* 사이드바 */
.sidebar {
  background: white;
  border-right: 1px solid var(--line);
  padding: 20px 0;
  overflow-y: auto;
  position: sticky; top: 60px; height: calc(100vh - 60px);
}
.sidebar-section {
  margin-bottom: 20px;
}
.sidebar-title {
  padding: 8px 20px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px;
  transition: color 0.1s;
}
.sidebar-title:hover { color: var(--accent); }
.sidebar-title .caret {
  display: inline-block; font-size: 10px; width: 10px;
  transition: transform 0.15s;
}
.sidebar-section.collapsed .caret { transform: rotate(-90deg); }
.sidebar-section.collapsed .sidebar-item.sub { display: none; }
.sidebar-item {
  padding: 8px 20px; cursor: pointer;
  color: var(--ink); font-size: 14px;
  display: flex; align-items: center; gap: 8px;
  border-left: 3px solid transparent;
  transition: all 0.1s;
}
.sidebar-item:hover { background: var(--hover); }
.sidebar-item.active {
  background: var(--active); color: var(--accent);
  font-weight: 700; border-left-color: var(--accent);
}
.sidebar-item.sub {
  padding-left: 40px; font-size: 13px; color: var(--muted);
}
.sidebar-item.sub.active { color: var(--accent); font-weight: 700; }
.sidebar-count {
  margin-left: auto; font-size: 11px;
  color: var(--muted); background: #f0f0f0;
  padding: 2px 8px; border-radius: 10px;
}
/* 메인 */
.main {
  padding: 24px 32px;
  overflow-y: auto;
}
.breadcrumb {
  color: var(--muted); font-size: 12px; margin-bottom: 12px;
}
.breadcrumb span { margin: 0 6px; }
.page-title {
  font-size: 22px; font-weight: 800; margin-bottom: 4px;
}
.page-sub {
  color: var(--muted); font-size: 13px; margin-bottom: 24px;
}
/* 홈 대시보드 */
.hero {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white; padding: 32px; border-radius: 16px;
  margin-bottom: 24px;
}
.hero h1 { font-size: 26px; margin-bottom: 8px; }
.hero p { opacity: 0.85; font-size: 14px; }
.dash-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.dash-card {
  background: white; border: 1px solid var(--line);
  border-radius: 14px; padding: 24px;
  cursor: pointer; transition: all 0.15s;
}
.dash-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
.dash-card .icon { font-size: 32px; margin-bottom: 8px; }
.dash-card h3 { font-size: 16px; margin-bottom: 4px; }
.dash-card .count { color: var(--accent); font-weight: 700; font-size: 24px; }
.dash-card .desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
/* 아이템 그리드 */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.card {
  background: white; border: 1px solid var(--line);
  border-radius: 10px; padding: 16px;
  transition: all 0.15s; cursor: pointer;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
.card-tag {
  display: inline-block;
  background: var(--active); color: var(--accent);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 10px;
  margin-bottom: 8px; letter-spacing: 0.05em;
}
.card-title {
  font-size: 15px; font-weight: 700; margin-bottom: 8px;
}
.card-body { font-size: 13px; color: #374151; }
.card-body dt { color: var(--muted); font-size: 11px; margin-top: 6px; }
.card-body dd { margin-bottom: 4px; font-weight: 500; }
.card-body .price { font-size: 18px; font-weight: 800; color: var(--primary); }
.card-body .price-old { text-decoration: line-through; color: var(--muted); font-size: 12px; }
.card-body .price-up { color: #d97706; font-size: 12px; font-weight: 700; }
/* 검색 결과 */
.search-results {
  max-height: 400px; overflow-y: auto;
  position: absolute; top: 44px; left: 0; right: 0;
  background: white; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 8px; display: none; z-index: 100;
}
.search-results.open { display: block; }
.search-group-title {
  padding: 8px 12px; font-size: 11px; font-weight: 800;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
}
.search-item {
  padding: 8px 12px; cursor: pointer; border-radius: 6px;
  font-size: 13px;
}
.search-item:hover { background: var(--hover); }
.search-item mark { background: #fef3c7; color: inherit; padding: 0 2px; }
.search-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }
/* 상세 뷰어 */
.detail {
  background: white; border-radius: 12px; padding: 24px;
  border: 1px solid var(--line);
}
.detail h2 { font-size: 20px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
.detail dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 20px; }
.detail dt { color: var(--muted); font-weight: 700; }
.detail dd { color: var(--ink); }
.detail .actions {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
  display: flex; gap: 8px;
}
.btn {
  padding: 8px 16px; border: 1px solid var(--line);
  background: white; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--ink);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: #0d9488; }
/* 로그인 오버레이 */
.auth-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: linear-gradient(135deg, #1e3a5f 0%, #0f766e 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.auth-card {
  background: white; border-radius: 16px;
  padding: 40px 32px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  text-align: center;
}
.auth-card .brand {
  font-size: 22px; font-weight: 800;
  color: var(--primary); margin-bottom: 4px;
}
.auth-card .brand span { color: var(--accent); }
.auth-card .sub {
  color: var(--muted); font-size: 12px; margin-bottom: 24px;
}
.auth-card .icon {
  font-size: 36px; margin-bottom: 12px;
}
.auth-card h2 {
  font-size: 16px; margin-bottom: 6px; color: var(--ink);
}
.auth-card p {
  font-size: 12px; color: var(--muted); margin-bottom: 20px;
}
.auth-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 15px; text-align: center;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
}
.auth-input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
}
.auth-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: white;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: background 0.15s;
}
.auth-btn:hover { background: #0d9488; }
.auth-error {
  color: #dc2626; font-size: 12px;
  margin-top: 8px; min-height: 16px;
}
.auth-note {
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 11px; color: var(--muted);
  line-height: 1.6;
}
/* 로그아웃 버튼 */
.logout-btn {
  background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px;
  font-size: 12px; cursor: pointer; color: var(--muted);
}
.logout-btn:hover { background: var(--hover); color: var(--ink); }

/* 필터 바 */
.filter-bar {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.filter-chip {
  padding: 6px 12px; background: white; border: 1px solid var(--line);
  border-radius: 20px; font-size: 12px; cursor: pointer;
}
.filter-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
.filter-chip:hover:not(.active) { background: var(--hover); }

/* ==================== 마크다운 렌더링 ==================== */
.md-body { line-height: 1.7; color: #374151; }
.md-body .md-h2 {
  font-size: 18px; font-weight: 800;
  color: var(--primary);
  margin: 20px 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--line);
}
.md-body .md-h3 {
  font-size: 15px; font-weight: 700;
  color: var(--ink);
  margin: 16px 0 8px;
}
.md-body .md-ul {
  padding-left: 22px;
  margin: 8px 0;
}
.md-body .md-ul li {
  margin-bottom: 6px;
  font-size: 14px;
}
.md-body .md-p {
  margin: 10px 0;
  font-size: 14px;
}
.md-body strong {
  color: var(--primary);
  font-weight: 700;
}

/* ==================== 학부모 응대: 권장 / 금지 블록 ==================== */
.response-block {
  border-radius: 12px;
  padding: 18px 20px;
  margin: 14px 0;
  border-left: 4px solid;
}
.response-block.ok {
  background: #ecfdf5;
  border-color: #10b981;
}
.response-block.ng {
  background: #fef2f2;
  border-color: #ef4444;
}
.response-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.response-block.ok .response-label { color: #059669; }
.response-block.ng .response-label { color: #dc2626; }
.response-text {
  font-size: 14px;
  line-height: 1.7;
  color: #1f2937;
  white-space: pre-wrap;
}

/* 햄버거 버튼 (데스크탑에서는 숨김) */
.hamburger {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer;
  font-size: 18px;
}
.hamburger:hover { background: var(--hover); }
/* 백드롭 */
.backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 15;
}
.backdrop.show { display: block; }
/* 사이드바 닫기 버튼 (모바일 전용) */
.sidebar-close {
  display: none;
  position: absolute; top: 12px; right: 12px;
  width: 32px; height: 32px;
  background: transparent; border: none; border-radius: 6px;
  cursor: pointer; font-size: 20px; color: var(--muted);
}
.sidebar-close:hover { background: var(--hover); }

/* ==================== 모바일 반응형 ==================== */
@media (max-width: 768px) {
  .header {
    padding: 10px 14px;
    gap: 10px;
  }
  .hamburger { display: inline-flex; }
  .logo { font-size: 16px; }
  .search-input {
    padding: 8px 14px 8px 36px;
    font-size: 13px;
  }
  .search-input::placeholder { font-size: 12px; }
  .search-icon { left: 12px; }
  .header-actions { display: none; }

  .layout {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: fixed;
    top: 0; left: -280px;
    width: 260px; height: 100vh;
    z-index: 20;
    transition: left 0.25s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    padding-top: 60px;
  }
  .sidebar.mobile-open { left: 0; }
  .sidebar-close { display: block; }

  .main { padding: 16px; }
  .hero { padding: 22px 18px; border-radius: 12px; }
  .hero h1 { font-size: 20px; }
  .hero p { font-size: 12px; }
  .dash-cards { grid-template-columns: 1fr; gap: 10px; }
  .dash-card { padding: 18px; }
  .grid { grid-template-columns: 1fr; gap: 10px; }

  .page-title { font-size: 18px; }
  .search-results {
    position: fixed;
    top: 60px; left: 8px; right: 8px;
    max-height: 60vh;
  }


  .detail { padding: 18px; }
  .detail dl { grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="메뉴 열기">☰</button>
  <div class="logo" onclick="goHome()">Flow <span>CS Hub</span></div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput"
           placeholder="캠퍼스명, 관, 전화번호, 매뉴얼 등 무엇이든 검색 (Ctrl+K)"
           oninput="onSearch(event)" onblur="setTimeout(hideSearchResults, 200)">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="header-actions">
    <span id="sourceInfo" title="연락처·수강료 데이터 소스" style="font-size:11px; color:var(--muted); margin-right:8px;"></span>
    <span title="공용 ID (송재풍 팀장 관리)">👤 CS 직원 전용</span>
  </div>
</header>

<div class="layout">
  <!-- 사이드바 (메뉴 엘리베이터) -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="메뉴 닫기">✕</button>
  </aside>

  <!-- 메인 콘텐츠 -->
  <main class="main" id="main"></main>
</div>

<!-- 백드롭 (모바일 사이드바 배경) -->
<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<!-- Flow 내장 챗봇 (Dify 대체 · Claude API 직접 연동) -->
<style>
  /* 플로팅 버튼 · 매력적 디자인 */
  @keyframes flow-bot-pulse {
    0%   { box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4), 0 0 0 0 rgba(217, 182, 111, 0.5); }
    70%  { box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4), 0 0 0 14px rgba(217, 182, 111, 0); }
    100% { box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4), 0 0 0 0 rgba(217, 182, 111, 0); }
  }
  @keyframes flow-bot-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  #flow-bot-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 999;
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(135deg, #14b8a6 0%, #0f766e 50%, #1e3a5f 100%);
    color: white; border: none; cursor: pointer;
    font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    animation: flow-bot-pulse 2.5s ease-out infinite, flow-bot-float 3.5s ease-in-out infinite;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), width 0.3s;
    overflow: hidden; white-space: nowrap;
    font-weight: 700; font-family: inherit;
  }
  #flow-bot-fab::before {
    content: ""; position: absolute; inset: 2px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 50%);
    pointer-events: none;
  }
  #flow-bot-fab .flow-bot-fab-icon {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.3s;
  }
  #flow-bot-fab .flow-bot-fab-label {
    position: relative; z-index: 1;
    font-size: 14px; margin-left: 8px; opacity: 0; width: 0;
    transition: opacity 0.25s, width 0.3s, margin-left 0.3s;
    overflow: hidden;
  }
  #flow-bot-fab:hover {
    width: 180px; border-radius: 32px;
    transform: scale(1.03);
    animation: none;
    box-shadow: 0 10px 30px rgba(15, 118, 110, 0.5);
  }
  #flow-bot-fab:hover .flow-bot-fab-label {
    opacity: 1; width: auto;
  }
  #flow-bot-fab:hover .flow-bot-fab-icon {
    transform: rotate(-10deg) scale(1.1);
  }
  #flow-bot-fab.active {
    background: linear-gradient(135deg, #ef4444, #991b1b);
    animation: none;
    width: 56px; height: 56px;
  }
  /* AI 뱃지 (FAB 기준 좌표) */
  #flow-bot-fab-badge {
    position: fixed; bottom: 70px; right: 18px; z-index: 1000;
    background: linear-gradient(135deg, #d9b66f, #b8860b);
    color: #1f2937; font-size: 9px; font-weight: 800;
    padding: 3px 7px; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    border: 2px solid white;
    letter-spacing: 0.5px;
    pointer-events: none;
    animation: flow-bot-float 3.5s ease-in-out infinite;
  }

  /* 챗봇 창 */
  #flow-bot-window {
    position: fixed; right: 24px; bottom: 96px; z-index: 998;
    width: 560px; height: calc(100vh - 130px); max-height: 900px;
    max-width: calc(100vw - 48px);
    background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    display: none; flex-direction: column; overflow: hidden;
    border: 1px solid var(--line);
  }
  #flow-bot-window.open { display: flex; }
  @media (max-width: 600px) {
    #flow-bot-window {
      right: 8px; left: 8px; bottom: 88px;
      width: auto; height: calc(100vh - 110px);
    }
  }
  .flow-bot-header {
    background: linear-gradient(135deg, #0f766e, #1e3a5f);
    color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .flow-bot-header-title { font-weight: 700; font-size: 14px; }
  .flow-bot-messages {
    flex: 1; overflow-y: auto; padding: 14px;
    background: var(--bg); display: flex; flex-direction: column; gap: 10px;
  }
  .flow-bot-msg {
    max-width: 85%; padding: 9px 12px; border-radius: 12px;
    font-size: 12.5px; line-height: 1.55; word-break: break-word;
    white-space: pre-wrap;
  }
  .flow-bot-msg.user {
    align-self: flex-end; background: #0f766e; color: white;
    border-bottom-right-radius: 4px;
  }
  .flow-bot-msg.bot {
    align-self: flex-start; background: white; color: var(--ink);
    border: 1px solid var(--line); border-bottom-left-radius: 4px;
  }
  .flow-bot-msg.loading { opacity: 0.6; font-style: italic; }
  .flow-bot-msg.error { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
  .flow-bot-sources {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 10.5px; color: var(--muted);
  }
  .flow-bot-sources-title { font-weight: 600; margin-bottom: 4px; }
  .flow-bot-input-area {
    padding: 12px; border-top: 1px solid var(--line); background: white;
    display: flex; gap: 8px;

<script>
// ==================== 데이터 로드 ====================
let DATA = { contacts: [], tuition: [], admin: [], parent_response: [], cs_appreciation: [], campus_guide: [], meta: null };
let FUSE = null;  // Fuse.js 인스턴스 (전체 검색)

/* 한글 초성 추출 (예: "광교 초등관" → "ㄱㄱ ㅊㄷㄱ") */
const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(s) {
  if (!s) return '';
  return String(s).split('').map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) return CHOSUNG[Math.floor(code / 588)];
    return ch;
  }).join('');
}
function isChosungQuery(q) {
  // 쿼리에 자모 문자만 있으면 초성 검색으로 판단
  return /^[ㄱ-ㅎ\s]+$/.test(q);
}

/* Google Sheet CSV → JSON 변환 (연락처) */
function csvToContacts(rows) {
  return rows.filter(r => r.id).map(r => {
    const camp = r['캠퍼스'] || '';
    const gwan = r['관/시설'] || '';
    const sub = r['분류'] || '';
    let title;
    if (sub === '캠퍼스 대표') title = `${camp} 캠퍼스 대표번호`;
    else if (sub === '본사') title = `본사 ${gwan}`;
    else title = `${camp} ${gwan}`.trim();
    return {
      id: r.id,
      category: "contacts",
      subcategory: sub,
      campus: camp,
      gwan: gwan,
      title: title,
      content: {
        "위치": r['위치'] || '',
        "직통번호": r['직통번호'] || '',
        "대표번호": r['대표번호'] || '',
        "담당자": r['담당자'] || '',
        "내선": r['내선'] || r['내선번호'] || '',
        "학원등록번호": r['학원등록번호'] || '',
        "비고": r['비고'] || '',
      },
      tags: [camp, gwan, '연락처'].filter(Boolean),
      search_text: [camp, gwan, r['담당자'], r['직통번호'], r['내선'], r['위치'], r['학원등록번호'], r['비고']].filter(Boolean).join(' '),
      related: [],
      updated: new Date().toISOString().slice(0, 10),
      _source: 'google-sheet',
    };
  });
}

/* Google Sheet CSV → JSON 변환 (수강료) */
function csvToTuition(rows) {
  return rows.filter(r => r.id).map(r => {
    const y25 = r['25년_수강료'] ? parseInt(String(r['25년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const y26 = r['26년_수강료'] ? parseInt(String(r['26년_수강료']).replace(/[^\d]/g, ''), 10) : null;
    const up = (y25 && y26) ? y26 - y25 : 0;
    return {
      id: r.id,
      category: "tuition",
      subcategory: r['구분'] || '',
      campus: r['캠퍼스'] || '',
      gwan: `${r['사업부']||''} ${r['브랜드']||''}`.trim(),
      title: `${r['캠퍼스']||''} ${r['구분']||''} ${r['회당']||''} ${r['과정']||''}`.replace(/\s+/g, ' ').trim(),
      content: {
        "사업부": r['사업부'] || '',
        "브랜드": r['브랜드'] || '',
        "회당": r['회당'] || '',
        "과정": r['과정'] || '',
        "25년_수강료": y25,
        "26년_수강료": y26,
        "비고": r['비고'] || '',
        "인상액": up,
      },
      tags: [r['캠퍼스'], r['구분'], r['사업부'], r['브랜드'], r['회당'], r['과정'], '수강료'].filter(Boolean),
      search_text: [r['캠퍼스'], r['구분'], r['사업부'], r['브랜드'], r['회당'], r['과정'], y26 ? y26+'원' : '', r['비고']].filter(Boolean).join(' '),
      related: [],
      updated: new Date().toISOString().slice(0, 10),
      _source: 'google-sheet',
    };
  });
}

/* CSV → 행정자료 (id 안정화 + 열명 검증) */
function csvToFiles(rows) {
  if (!rows || !rows.length) return [];
  // 열명 검증: 필수 컬럼 하나라도 없으면 콘솔 경고 (조용한 실패 방지)
  const sample = rows[0] || {};
  const expected = ['파일명','분류','드라이브 링크'];
  const missing = expected.filter(k => !(k in sample) && !(sample.title || sample.drive_url));
  if (missing.length) {
    console.warn('[csvToFiles] 「행정자료」 시트 필수 컬럼 누락: ' + missing.join(', ') + ' — 시트 헤더(1행)를 확인하세요.');
  }
  // 간단 해시 (파일ID 없을 때 title+category 기반 안정적 id)
  const hashStr = s => {
    let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return Math.abs(h).toString(36);
  };
  return rows.filter(r => (r['파일명'] || r.title)).map((r, idx) => {
    const title = r['파일명'] || r.title || '';
    const fileId = r['파일ID'] || r.file_id || '';
    const category = r['분류'] || r.category || '행정자료';
    // id 우선순위: 파일ID > 기존 id > title+category hash (행 순서 바뀌어도 북마크 유지)
    const stableId = fileId ? ('file-' + fileId)
                   : (r.id || ('file-h-' + hashStr(title + '|' + category)));
    return {
      id: stableId,
      title: title,
      category: category,
      description: r['설명'] || r.description || '',
      drive_url: r['드라이브 링크'] || r['링크'] || r.drive_url || '',
      download_url: r['다운로드 링크'] || r.download_url || '',
      updated: r['수정일'] || r.updated || '',
      keywords: r['키워드'] || r.keywords || '',
      file_type: r['파일 종류'] || r.file_type || '',
      _source: 'google-sheet',
    };
  });
}

/* Google Sheet CSV 로드 (실패 시 null) */
async function fetchSheetCSV(url) {
  if (!url || !/^https?:\/\//.test(url)) return null;
  try {
    // 캐시 무효화용 timestamp
    const sep = url.includes('?') ? '&' : '?';
    const bustUrl = url + sep + '_ts=' + Math.floor(Date.now() / 60000); // 1분 캐시
    const res = await fetch(bustUrl);
    if (!res.ok) return null;
    const text = await res.text();
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    if (parsed.errors.length && !parsed.data.length) return null;
    return parsed.data;
  } catch (e) {
    console.warn('시트 로드 실패, 로컬 JSON 사용:', e);
    return null;
  }
}

async function loadData() {
  // 시트 설정 먼저 로드
  let sheetConfig = { contacts_csv_url: '', tuition_csv_url: '' };
  try {
    sheetConfig = await fetch('data/sheet-config.json?_ts=' + Math.floor(Date.now() / 60000)).then(r => r.json());
  } catch {}

  const bust = '?_ts=' + Math.floor(Date.now() / 60000);
  const [c_local, t_local, a, pr, ca, cg, files_local, m, c_sheet, t_sheet, files_sheet] = await Promise.all([
    fetch('data/contacts.json' + bust).then(r => r.json()),
    fetch('data/tuition.json' + bust).then(r => r.json()),
    fetch('data/admin.json' + bust).then(r => r.json()),
    fetch('data/parent-response.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/cs-appreciation.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/campus-guide.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/files.json' + bust).then(r => r.json()).catch(() => []),
    fetch('data/meta.json' + bust).then(r => r.json()),
    fetchSheetCSV(sheetConfig.contacts_csv_url),
    fetchSheetCSV(sheetConfig.tuition_csv_url),
    fetchSheetCSV(sheetConfig.files_csv_url),
  ]);

  // 시트 데이터 있으면 우선 사용, 없으면 로컬
  const c = (c_sheet && c_sheet.length) ? csvToContacts(c_sheet) : c_local;
  const t = (t_sheet && t_sheet.length) ? csvToTuition(t_sheet) : t_local;
  // 🔗 files는 merge: 시트(공유 드라이브 자동) + 로컬 files.json(수동 외부 링크)
  // 중복 id는 로컬이 우선 (수동 등록이 더 최신 정보로 간주)
  const filesFromSheet = (files_sheet && files_sheet.length) ? csvToFiles(files_sheet) : [];
  const filesFromLocal = Array.isArray(files_local) ? files_local : [];
  const seenFileIds = new Set(filesFromLocal.map(f => f.id));
  const files = [...filesFromLocal, ...filesFromSheet.filter(f => !seenFileIds.has(f.id))];

  DATA.contacts = c; DATA.tuition = t; DATA.admin = a;
  DATA.parent_response = pr; DATA.cs_appreciation = ca; DATA.campus_guide = cg;
  DATA.files = files; DATA.meta = m;

  // 데이터 소스 배지
  const sourceInfo = document.getElementById('sourceInfo');
  if (sourceInfo) {
    const cSrc = (c_sheet && c_sheet.length) ? '🟢 시트' : '📄 로컬';
    const tSrc = (t_sheet && t_sheet.length) ? '🟢 시트' : '📄 로컬';
    sourceInfo.textContent = `연락처 ${cSrc} · 수강료 ${tSrc}`;
  }

  // 초성 필드 자동 추가
  const all = [...c, ...t, ...a, ...pr, ...ca, ...cg];
  all.forEach(item => {
    item.chosung_text = toChosung(item.search_text || '') + ' ' + toChosung(item.title || '');
  });

  // Fuse.js 인스턴스 (오타 허용 + 다중 필드)
  FUSE = new Fuse(all, {
    keys: [
      { name: 'title',        weight: 3 },
      { name: 'search_text',  weight: 2 },
      { name: 'tags',         weight: 1.5 },
      { name: 'chosung_text', weight: 1 },
    ],
    threshold: 0.35,      // 0(엄격) ~ 1(관대). 오타 허용도
    ignoreLocation: true, // 문장 위치 무관
    minMatchCharLength: 2,
    includeScore: true,
  });

  renderSidebar();
  renderRoute();
}

// ==================== 라우팅 ====================
// URL 해시: #/category/subcategory/detail-id
let CURRENT = { page: 'home', category: null, subcategory: null, itemId: null };

function goHome() { location.hash = ''; closeSidebar(); }
function goCategory(cat, sub) {
  location.hash = sub ? `#/${cat}/${encodeURIComponent(sub)}` : `#/${cat}`;
  closeSidebar();
}
function goDetail(id) {
  location.hash = `#/detail/${id}`;
  closeSidebar();
}
/* 모바일 사이드바 토글 */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  const open = sb.classList.toggle('mobile-open');
  bd.classList.toggle('show', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('backdrop');
  sb.classList.remove('mobile-open');
  bd.classList.remove('show');
  document.body.style.overflow = '';
}

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { page: 'home' };
  const parts = h.split('/').map(decodeURIComponent);
  if (parts[0] === 'detail') return { page: 'detail', itemId: parts[1] };
  return {
    page: 'category',
    category: parts[0],
    subcategory: parts[1] || null,
  };
}

function renderRoute() {
  CURRENT = parseHash();
  renderSidebar(); // active 상태 갱신
  if (CURRENT.page === 'home') renderHome();
  else if (CURRENT.page === 'category') renderCategory();
  else if (CURRENT.page === 'detail') renderDetail();
}
window.addEventListener('hashchange', renderRoute);

// ==================== 사이드바 ====================
// 사이드바 섹션 접기/펼치기 상태 (기본: 모두 접힘, 활성 카테고리는 자동 펼침)
window.SIDEBAR_OPEN = window.SIDEBAR_OPEN || (() => {
  try {
    const saved = localStorage.getItem('flowcs_sidebar_open');
    if (saved) return JSON.parse(saved);
  } catch(e){}
  return {};
})();
function toggleSidebarSection(key) {
  window.SIDEBAR_OPEN[key] = !window.SIDEBAR_OPEN[key];
  try { localStorage.setItem('flowcs_sidebar_open', JSON.stringify(window.SIDEBAR_OPEN)); } catch(e){}
  renderSidebar();
}
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  if (!DATA.meta) return;
  const active = (cat, sub=null) =>
    CURRENT.category === cat && (sub === null || CURRENT.subcategory === sub) ? 'active' : '';
  const isHomeActive = CURRENT.page === 'home' ? 'active' : '';
  // 활성 섹션은 자동 펼침
  const secClass = (key) => {
    const open = window.SIDEBAR_OPEN[key] === true || CURRENT.category === key;
    return 'sidebar-section' + (open ? '' : ' collapsed');
  };

  // 캠퍼스별 그룹핑 (본사 포함)
  const campusCounts = {};
  DATA.contacts.forEach(x => { if (x.campus) campusCounts[x.campus] = (campusCounts[x.campus]||0) + 1; });
  const campusTotal = DATA.contacts.length;

  // 수강료 서브카테고리
  const tuitionSubs = DATA.meta.tuition_subcategories;
  const tuitionCounts = {};
  DATA.tuition.forEach(x => tuitionCounts[x.subcategory] = (tuitionCounts[x.subcategory]||0) + 1);

  // 매뉴얼 서브카테고리
  const adminSubs = DATA.meta.admin_subcategories;
  const adminCounts = {};
  DATA.admin.forEach(x => adminCounts[x.subcategory] = (adminCounts[x.subcategory]||0) + 1);

  // 학부모 응대 서브카테고리
  const prSubs = DATA.meta.parent_response_subcategories || [];
  const prCounts = {};
  DATA.parent_response.forEach(x => prCounts[x.subcategory] = (prCounts[x.subcategory]||0) + 1);

  // CS 감탄 매뉴얼 서브카테고리
  const caSubs = DATA.meta.cs_appreciation_subcategories || [];
  const caCounts = {};
  DATA.cs_appreciation.forEach(x => caCounts[x.subcategory] = (caCounts[x.subcategory]||0) + 1);

  // 캠퍼스별 상담자료 서브카테고리
  const cgSubs = DATA.meta.campus_guide_subcategories || [];
  const cgCounts = {};
  DATA.campus_guide.forEach(x => cgCounts[x.subcategory] = (cgCounts[x.subcategory]||0) + 1);

  sb.innerHTML = `
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="메뉴 닫기">✕</button>
    <div class="sidebar-section">
      <div class="sidebar-item ${isHomeActive}" onclick="goHome()">📍 홈</div>
      <div class="sidebar-item" onclick="window.open('https://drive.google.com/drive/folders/18EmHVzVXSDsZWph5wWFxAqS3WJ5OUq4b','_blank','noopener')">
        📁 CS 행정자료 <span class="sidebar-count">${(DATA.files||[]).length}</span>
      </div>
    </div>

    <div class="${secClass('contacts')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('contacts')"><span class="caret">▼</span> 🏢 캠퍼스 정보</div>
      <div class="sidebar-item ${CURRENT.category==='contacts' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('contacts')">전체 <span class="sidebar-count">${campusTotal}</span></div>
      ${DATA.meta.campuses.map(c => `
        <div class="sidebar-item sub ${active('contacts', c)}" onclick="goCategory('contacts','${c}')">
          · ${c} <span class="sidebar-count">${campusCounts[c]||0}</span>
        </div>
      `).join('')}
    </div>


    <div class="${secClass('tuition')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('tuition')"><span class="caret">▼</span> 💰 수강료 (26년)</div>
      <div class="sidebar-item ${CURRENT.category==='tuition' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('tuition')">전체 <span class="sidebar-count">${DATA.tuition.length}</span></div>
      ${tuitionSubs.map(s => `
        <div class="sidebar-item sub ${active('tuition', s)}" onclick="goCategory('tuition','${s}')">
          · ${s} <span class="sidebar-count">${tuitionCounts[s]||0}</span>
        </div>
      `).join('')}
    </div>

    <div class="${secClass('admin')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('admin')"><span class="caret">▼</span> 📖 행정 매뉴얼</div>
      <div class="sidebar-item ${CURRENT.category==='admin' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('admin')">전체 <span class="sidebar-count">${DATA.admin.length}</span></div>
      ${adminSubs.map(s => `
        <div class="sidebar-item sub ${active('admin', s)}" onclick="goCategory('admin','${s}')">
          · ${s.replace('- ','')} <span class="sidebar-count">${adminCounts[s]||0}</span>
        </div>
      `).join('')}
    </div>

    <div class="${secClass('parent_response')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('parent_response')"><span class="caret">▼</span> 💬 학부모 응대 매뉴얼</div>
      <div class="sidebar-item ${CURRENT.category==='parent_response' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('parent_response')">전체 <span class="sidebar-count">${DATA.parent_response.length}</span></div>
      ${prSubs.map(s => `
        <div class="sidebar-item sub ${active('parent_response', s)}" onclick="goCategory('parent_response','${s}')">
          · ${s} <span class="sidebar-count">${prCounts[s]||0}</span>
        </div>
      `).join('')}
    </div>

    <div class="${secClass('cs_appreciation')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('cs_appreciation')"><span class="caret">▼</span> ⭐ CS 감탄 매뉴얼</div>
      <div class="sidebar-item ${CURRENT.category==='cs_appreciation' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('cs_appreciation')">전체 <span class="sidebar-count">${DATA.cs_appreciation.length}</span></div>
      ${caSubs.map(s => `
        <div class="sidebar-item sub ${active('cs_appreciation', s)}" onclick="goCategory('cs_appreciation','${s}')">
          · ${s} <span class="sidebar-count">${caCounts[s]||0}</span>
        </div>
      `).join('')}
    </div>

    <div class="${secClass('campus_guide')}">
      <div class="sidebar-title" onclick="toggleSidebarSection('campus_guide')"><span class="caret">▼</span> 🏫 캠퍼스별 상담자료</div>
      <div class="sidebar-item ${CURRENT.category==='campus_guide' && !CURRENT.subcategory ? 'active' : ''}"
           onclick="goCategory('campus_guide')">전체 <span class="sidebar-count">${DATA.campus_guide.length}</span></div>
      ${cgSubs.map(s => `
        <div class="sidebar-item sub ${active('campus_guide', s)}" onclick="goCategory('campus_guide','${s}')">
          · ${s} <span class="sidebar-count">${cgCounts[s]||0}</span>
        </div>
      `).join('')}
    </div>

/* 간단 마크다운 렌더러 */
function renderMarkdown(md) {
  if (!md) return '';
  const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = escape(md);
  // 헤딩
  out = out.replace(/^## (.+)$/gm, '<h3 class="md-h3">$1</h3>');
  out = out.replace(/^# (.+)$/gm, '<h2 class="md-h2">$1</h2>');
  // 볼드
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // 리스트 (- 로 시작)
  out = out.replace(/(?:^- .+(?:\n|$))+/gm, block => {
    const items = block.trim().split('\n').map(l => l.replace(/^- /, '').trim());
    return '<ul class="md-ul">' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
  });
  // 문단 (빈 줄로 구분)
  out = out.split(/\n\n+/).map(p => {
    if (p.match(/^<(h2|h3|ul)/)) return p;
    return `<p class="md-p">${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return out;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// onclick 등 HTML attribute 안에 안전하게 넣기 위한 escape (JS 문자열 escape 포함)
function escapeAttr(s) {
  return String(s || '').replace(/\\/g,'\\\\').replace(/'/g,'\\\'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'\\n');
}

function copyItem(id) {
  const item = allItems().find(x => x.id === id);
  if (!item) return;
  let text = `${item.title}\n`;
  const c = item.content;
  if (c.markdown) {
    text += c.markdown;
  } else if (c.recommended || c.avoid) {
    text += `\n[권장 답변]\n${c.recommended || ''}\n\n[피해야 할 응대]\n${c.avoid || ''}`;
  } else {
    text += Object.entries(c).filter(([k,v]) => v).map(([k,v]) => `${k}: ${v}`).join('\n');
  }
  navigator.clipboard.writeText(text).then(() => alert('복사됨'));
}

// ==================== 검색 (Fuse.js + 초성 지원) ====================
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(text, query) {
  if (!text) return '';
  const safe = escapeHtml(text);
  if (!query) return safe;
  try {
    const re = new RegExp(escapeRegex(escapeHtml(query)), 'gi');
    return safe.replace(re, m => `<mark>${m}</mark>`);
  } catch { return safe; }
}

function onSearch(e) {
  const raw = e.target.value.trim();
  const box = document.getElementById('searchResults');
  if (!raw || !FUSE) { box.classList.remove('open'); return; }

  // 초성 쿼리 판별해 검색어 변환
  const chosungMode = isChosungQuery(raw);
  const query = raw; // Fuse에 그대로 전달 (다중 필드 매칭)

  const hits = FUSE.search(query, { limit: 40 });
  const results = hits.map(h => h.item);

  if (results.length === 0) {
    box.innerHTML = `<div class="search-empty">검색 결과 없음<br><span style="font-size:11px;color:var(--muted);">오타·초성(ㄱㄱ ㅊㄷ)도 지원합니다</span></div>`;
    box.classList.add('open'); return;
  }

  // 그룹핑
  const grouped = { contacts: [], tuition: [], admin: [], parent_response: [], cs_appreciation: [], campus_guide: [] };
  results.forEach(r => {
    const k = (r.category || '').replace('-','_');
    if (grouped[k]) grouped[k].push(r);

  const catLabel = {
    contacts: '🏢 캠퍼스 정보',
    tuition: '💰 수강료',
    admin: '📖 행정 매뉴얼',
    parent_response: '💬 학부모 응대 매뉴얼',
    cs_appreciation: '⭐ CS 감탄 매뉴얼',
    campus_guide: '🏫 캠퍼스별 상담자료'
  };

  box.innerHTML = Object.entries(grouped).filter(([k,v]) => v.length).map(([k,v]) => `
    <div class="search-group-title">${catLabel[k]} (${v.length}건)</div>
    ${v.slice(0, 8).map(item => {
      const title = chosungMode ? escapeHtml(item.title) : highlightText(item.title, raw);

    }).join('')}
  `).join('') + `<div style="padding:8px 12px; font-size:11px; color:var(--muted); border-top:1px solid var(--line);">
    총 ${results.length}건 · Enter로 전체 결과 · 오타/초성(ㄱㄱ) 지원
  </div>`;
  box.classList.add('open');
}

const FlowBot = (function() {
  let config = { enabled: false, worker_url: '', model: 'claude-haiku-4-5', max_tokens: 1024, temperature: 0.3, top_k_search: 5 };
  const messages = [];  // 대화 히스토리
  let isOpen = false;
  let isSending = false;

  async function loadConfig() {
    try {
      const r = await fetch('data/chatbot-config.json?_t=' + Date.now());
      config = await r.json();
    } catch (e) {
      console.warn('챗봇 설정 로드 실패:', e);
    }
  }

  function toggle() {
    isOpen = !isOpen;
    const win = document.getElementById('flow-bot-window');
    const fab = document.getElementById('flow-bot-fab');
    const badge = document.getElementById('flow-bot-fab-badge');
    const iconEl = fab.querySelector('.flow-bot-fab-icon');
    const labelEl = fab.querySelector('.flow-bot-fab-label');
    if (isOpen) {
      win.classList.add('open');
      fab.classList.add('active');
      if (iconEl) iconEl.textContent = '✕';
      if (labelEl) labelEl.textContent = '';
      if (badge) badge.style.display = 'none';

      }

  async function send() {
    if (isSending) return;
    const input = document.getElementById('flowBotInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    addMsg('user', text);
    messages.push({ role: 'user', content: text });

    isSending = true;
    document.getElementById('flowBotSend').disabled = true;

    try {
      // 🪝 특수 핸들러 선처리 (인삿말·도움말·무의미 질의·감정 질의)
      const special = handleSpecialQuery(text);
      if (special) { return; }

      // 로컬 검색 + 템플릿 포맷 (LLM 없음, 즉시 응답)
      const hits = searchLocal(text);
      const quality = evaluateAnswerQuality(text, hits);

      // 캠퍼스 미매칭 폴백 안내 (searchLocal이 _NO_CAMPUS_DATA를 심어둠)
      if (hits.length === 0 && window._NO_CAMPUS_DATA) {
        const info = window._NO_CAMPUS_DATA;
        const catKo = { contacts:'연락처', tuition:'수강료', admin:'행정 매뉴얼', files:'행정자료', parent_response:'학부모 응대', cs_appreciation:'CS 감탄', campus_guide:'캠퍼스 상담자료' }[info.category] || info.category;
        addMsg('bot', `ℹ️ 「${info.campus}」의 ${catKo} 데이터는 등록되어 있지 않습니다.\n\n필요하시면 「자료 업데이트 요청」으로 등록을 부탁드리세요.`, null, 'no-campus');
        return;
      }

      if (hits.length === 0 || quality === 'none') {
        showNotFoundMessage(text);
      } else if (quality === 'weak') {
        // 매칭 약함 — 결과는 보여주되 업데이트 요청 안내 함께
        const main = hits[0];
        addMsg('bot', formatAnswer(main), hits.slice(0, 3).map(h => h.title), '', main);
        showUpdateRequestPrompt(text, '검색 결과가 질문과 정확히 일치하지 않을 수 있습니다.');
      } else {
        // 품질 OK
        const main = hits[0];
        addMsg('bot', formatAnswer(main), hits.slice(0, 3).map(h => h.title), '', main);
        if (hits.length > 1) {
          showOtherHits(hits.slice(1, 4));
        }
      }
    } catch (err) {
      addMsg('bot', `오류: ${err.message}`, null, 'error');
    } finally {
      isSending = false;
      document.getElementById('flowBotSend').disabled = false;
    }
  }

  // 답변 품질 판정: good / weak / none
  function evaluateAnswerQuality(query, hits) {
    if (!hits || hits.length === 0) return 'none';

    // 질문에서 2글자 이상의 의미 단어 추출 (불용어 제외)
    const stopwords = new Set(['알려줘','알려주세요','뭐야','무엇','어떻게','방법','주세요','입니다','주소','번호','연락처']);
    const keywords = query.split(/\s+/).filter(w => w.length >= 2 && !stopwords.has(w));
    if (keywords.length === 0) return 'good'; // 키워드 추출 불가 시 결과 신뢰

    const top = hits[0];
    const topText = (top.title + ' ' + (top.search_text || '') + ' ' + JSON.stringify(top.content || {})).toLowerCase();

    // 질문 키워드 중 몇 개가 결과에 포함되나? (부분 매칭 포함)
    const titleLower = (top.title || '').toLowerCase();
    let matched = 0;
    keywords.forEach(kw => {
      const k = kw.toLowerCase();
      if (topText.includes(k)) { matched += 1; return; }
      // 부분 매칭 — 접두사 2글자 ("재무팀" → "재무기획팀" title에 "재무" 포함) 0.7점
      if (k.length >= 3 && titleLower.includes(k.substring(0, 2))) { matched += 0.7; return; }
      // 더 완화된 부분 — 2글자라도 title에 있으면 0.5점
      if (k.length >= 2 && titleLower.includes(k.substring(0, 2))) matched += 0.5;
    });

    const matchRatio = matched / keywords.length;

    if (matchRatio >= 0.6) return 'good';   // 60% 이상 매칭
    if (matchRatio >= 0.3) return 'weak';   // 30~60%: 결과는 있지만 애매
    return 'none';                           // 30% 미만: 매칭 거의 없음
  }

  // 로컬 검색 (의도 감지 → 카테고리 전용 검색 우선 → Fuse 전체 검색 폴백)
  function searchLocal(query) {
    if (!FUSE) return [];
    const q = query.trim();
    const intent = detectIntent(q);
    const limit = 10;

    const allHits = []; // {item, source, rank}
    const seen = new Set();
    const addHit = (item, source) => {
      if (!item || seen.has(item.id)) return;
      seen.add(item.id);
      allHits.push({ item, source });
    };

    // 1순위: intent.category 감지된 경우 그 카테고리 내 간단 매칭
    window._NO_CAMPUS_DATA = null; // 리셋
    if (intent.category && DATA[intent.category]) {
      // adminSub 지정된 경우 (수익코드·반형태) 해당 서브카테고리만 필터
      let pool = DATA[intent.category];
      // files 카테고리는 allItems 변환 형태로 사용 (drive_url 등 메타 유지)
      if (intent.category === 'files') {
        pool = allItems().filter(x => x.category === 'files');
      }
      if (intent.adminSub) {
        pool = pool.filter(item => (item.subcategory || '').startsWith(intent.adminSub + '.'));
      }

      // 🔒 캠퍼스 미매칭 폴백 — files 카테고리는 campus 필드 없음 → 제외
      // (파일은 공통 자료라서 캠퍼스 선필터로 걸러내면 잘못된 "없음" 안내가 뜸)
      if (intent.campus && intent.category !== 'files') {
        const campusPool = pool.filter(item =>
          item.campus === intent.campus ||
          (item.content && item.content.캠퍼스 && String(item.content.캠퍼스).includes(intent.campus))
        );
        if (campusPool.length === 0) {
          window._NO_CAMPUS_DATA = { campus: intent.campus, category: intent.category };
          return []; // Fuse 폴백도 돌지 않음 — 치명 오답(정자 수강료→수내) 차단
        }
        pool = campusPool;
      }

      // 키워드에서 "수익코드"·"반형태" 등 메타 단어 제거 (고유번호·캠퍼스·브랜드 등 핵심만)
      const metaWords = /수익코드|반형태|코드|고유번호|구분|담당자|내선|전화|직통|연락처|주소|위치|어디|알려줘|주세요|뭐야|무엇|어떻게/g;
      const q2 = q.replace(metaWords, ' ').trim();
      const keywords = q2.split(/\s+/).filter(w => w.length >= 1);

      // 🔎 pool 내 Fuse 재검색 (부분 매칭 — "재무팀" → "재무기획팀" 자동 매칭)
      const poolFuse = new Fuse(pool, {
        keys: [{name:'title', weight:3}, {name:'search_text', weight:2}, {name:'tags', weight:1}],
        threshold: 0.4, ignoreLocation: true, minMatchCharLength: 2, includeScore: true,
      });
      const poolHits = poolFuse.search(q2 || q, { limit: 10 });

      // keyword scoring + Fuse 결합
      const fuseScoreMap = new Map();
      poolHits.forEach(h => fuseScoreMap.set(h.item.id, 1 - (h.score || 0)));

      const scored = pool.map(item => {
        const text = (item.title + ' ' + (item.search_text || '') + ' ' + JSON.stringify(item.content || {})).toLowerCase();
        const titleLower = (item.title || '').toLowerCase();
        let score = 0;
        keywords.forEach(kw => {
          const k = kw.toLowerCase();
          if (text.includes(k)) {
            score += 1;
            // 제목 완전 포함이면 +1 추가
            if (titleLower.includes(k)) score += 1;
          } else if (k.length >= 3) {
            // 부분 매칭 — 접두사 2글자가 제목에 있으면 큰 가중치 ("재무팀" → "재무기획팀")
            const prefix = k.substring(0, 2);
            if (titleLower.includes(prefix)) score += 1.5;
            else if (text.includes(prefix)) score += 0.5;
          } else if (k.length === 2 && titleLower.includes(k)) {
            // 2글자 키워드도 title 포함이면 보너스
            score += 0.5;
          }
        });
        // Fuse 매칭도 반영 (fuzzy / 부분 매칭)
        score += (fuseScoreMap.get(item.id) || 0) * 2;
        // 캠퍼스 매칭 가중치
        if (intent.campus && item.campus === intent.campus) score += 3;
        if (intent.campus && item.content && item.content.캠퍼스 && String(item.content.캠퍼스).includes(intent.campus)) score += 3;
        return { item, score };
      }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);
      scored.slice(0, 5).forEach(x => addHit(x.item, 'intent-category'));
    }

    // 2순위: Fuse 전체 검색 (오타·관련어 포함)
    FUSE.search(q, { limit }).forEach(h => addHit(h.item, 'fuse-original'));

    // 3순위: 불용어 제거 후 재검색
    if (allHits.length < 3) {
      const cleaned = cleanQuery(q);
      if (cleaned && cleaned !== q) {
        FUSE.search(cleaned, { limit }).forEach(h => addHit(h.item, 'fuse-cleaned'));
      }
    }

    // 4순위: 캠퍼스+관 핵심 키워드로 재검색
    if (allHits.length < 3) {
      const keywords = extractCoreKeywords(q);
      if (keywords) {
        FUSE.search(keywords, { limit }).forEach(h => addHit(h.item, 'fuse-keywords'));
      }
    }

    // source 우선순위 정렬 (intent-category가 Fuse 전체 폴백보다 상위)
    const srcOrder = { 'intent-category': 0, 'fuse-original': 1, 'fuse-cleaned': 2, 'fuse-keywords': 3 };
    allHits.sort((a, b) => (srcOrder[a.source] ?? 9) - (srcOrder[b.source] ?? 9));
    let hits = allHits.map(x => x.item);

    // intent.campus 매칭 가중치 — files 카테고리 질의는 제외 (파일에는 campus 필드 없음)
    if (intent.campus && intent.category !== 'files') {
      hits.sort((a, b) => {
        const aC = (a.campus === intent.campus) ? -1 : 1;
        const bC = (b.campus === intent.campus) ? -1 : 1;
        return aC - bC;
      });
    }

    return hits.slice(0, 5);
  }

  // 쿼리에서 불용어 제거
  function cleanQuery(q) {
    const stopwords = /(알려줘|알려주세요|뭐야|무엇이|무엇|어떻게|방법|어디야|어디|에요|인가요|주세요|입니다|있어|있나|주소|전화번호|연락처|번호|가격|비용|얼마|좀|의|를|을|이|가|은|는)/g;
    return q.replace(stopwords, ' ').replace(/\s+/g, ' ').trim();
  }

  // 캠퍼스 + 관 핵심 키워드만 추출
  function extractCoreKeywords(q) {
    const campuses = ['이매', '수내', '수지', '광교', '영통', '정자', '본사'];
    const gwans = ['초등', '중등', '고등', '영재', '사이언스카이', '사스', '테디', '더블랙'];
    const found = [];
    campuses.forEach(c => { if (q.includes(c)) found.push(c); });
    gwans.forEach(g => { if (q.includes(g)) found.push(g); });
    return found.join(' ');
  }

  // 질문 의도 감지 (키워드 기반)
  // 🪝 특수 질의 핸들러 (인삿말·도움말·감정·무의미 질의)
  // 반환 true: send()가 즉시 종료 (addMsg 이미 호출됨)
  function handleSpecialQuery(q) {
    const t = (q || '').trim();
    // 1) 무의미 질의: 2글자 미만 or 한글 음절/영숫자 섞인 쓰레기 패턴
    //    (예: "ㄱㄱ", "ㅋㅋㅋ", "aaa", "123", "...")
    if (t.length < 2) {
      addMsg('bot', '질문을 조금 더 자세히 입력해 주세요. 예: "광교 중등관 담당자", "수내 초등 수강료", "사업자등록증"', null, 'tip');
      return true;
    }
    if (/^[ㄱ-ㅎㅏ-ㅣ\s]+$/.test(t) || /^[a-zA-Z]{1,4}$/.test(t) || /^\d+$/.test(t)) {
      addMsg('bot', '질문을 완성된 단어로 입력해 주세요. 예: "환불 응대", "본사 인사기획팀", "플로우교육 사업자등록증"', null, 'tip');
      return true;
    }
    // 2) 인삿말·도움말
    if (/^(안녕|hi|hello|헬로|도움말|help|사용법|뭐야|뭐할수있어|사용방법|가이드)/.test(t)) {
      const msg = `안녕하세요! Flow CS Hub 챗봇입니다 🤝

이렇게 질문해 주세요:
• 캠퍼스/담당자 — "광교 중등관 담당자", "수내 초등 직통번호"
• 수강료 — "수내 중등 사아 수강료", "26년 수강료"
• 매뉴얼 — "환불 응대", "비즈메카", "교육청 강사 등록"
• 수익코드 — "수익코드 광교 초등"
• 행정자료 — "플로우교육 사업자등록증", "학원운영등록증"

데이터에 없으면 "자료 업데이트 요청"으로 안내드립니다.`;
      addMsg('bot', msg, null, 'help');
      return true;
    }
    // 3) 감정/학부모 역할 시뮬레이션
    if (/비싸|비쌉|비쌈|불만|화나|짜증|환불\s*해\s*줘|돈|너무/.test(t)) {
      addMsg('bot', '학부모 응대 상황이신가요? 아래 매뉴얼을 참고해주세요.', null, 'guide');
      // 그대로 흘려서 parent_response/환불 매뉴얼 검색 결과 보이도록 return false
      return false;
    }
    return false;
  }

  // 담당자명 자동 사전 (최초 1회 캐싱) — contacts.content.담당자에서 추출
  let CONTACT_NAMES_CACHE = null;
  function getContactNames() {
    if (CONTACT_NAMES_CACHE) return CONTACT_NAMES_CACHE;
    const names = new Set();
    const TITLE = /(부원장|팀장|과장|대리|주임|사원|선생님|선생|부장|차장|이사|대표|실장|관장|원장|소장|상담사|코디|팀|과)/;
    (DATA.contacts || []).forEach(c => {
      const raw = c.content && c.content.담당자 ? c.content.담당자 : '';
      if (!raw) return;
      // "조연희팀장(대리) · 박병우대리 (내선 9702)" → 각 조각에서 직급어 앞 이름 추출
      raw.replace(/\([^)]*\)/g, '').split(/[·,、/]/).forEach(part => {
        const t = part.trim();
        if (!t) return;
        const splitIdx = t.search(TITLE);
        const nameCand = splitIdx > 0 ? t.slice(0, splitIdx).trim() : t;
        if (/^[가-힣]{2,4}$/.test(nameCand)) names.add(nameCand);
      });
    });
    CONTACT_NAMES_CACHE = Array.from(names);
    return CONTACT_NAMES_CACHE;
  }

  function detectIntent(q) {
    const intent = { category: null, campus: null, adminSub: null };

    // ⭐ 파일/행정자료 다운로드 요청 (최우선)
    // 공식 파일명 패턴도 포함: 제N학원, N타워, N빌딩, 학원운영등록증, 등록증, pdf, 메이플라워 등
    if (/파일|자료\s*(다운|주세요|찾)|다운\s*(로드|받)|사업자등록|사업자\s*등록|증빙|양식|템플릿|로고|CI|BI|심볼|서식|업로드|문서\s*파일|PDF|엑셀\s*파일|한글\s*파일|다운받|제\s*\d+\s*학원|\d+\s*타워|\d+\s*빌딩|엔타워|N타워|학원운영등록증|학원\s*등록증|등록증\s*파일|메이플라워|플로우교육|풍해빌딩|다운타운|엔타워|한화빌딩|금강프라자|정민빌딩|셔틀|노선표|노선|시간표|운행|버스/i.test(q)) {
      intent.category = 'files';
    }
    // ⭐ admin 하위 특수 서브카테고리 우선 체크 (수익코드·반형태)
    else if (/수익코드|수익\s*구분|코드\s*번호/.test(q)) {
      intent.category = 'admin';
      intent.adminSub = 'Ⅳ';  // Ⅳ. 수익코드
    } else if (/반형태|반\s*구분|고유\s*번호|관리자/.test(q)) {
      intent.category = 'admin';
      intent.adminSub = 'Ⅲ';  // Ⅲ. 반형태 · 수익구분
    }
    // 그 외 카테고리 힌트
    // 'tuition': "원" 1글자 매칭 금지 → 숫자+원 또는 "수강료"·"비용"·"가격"·"얼마" 명시어 필요
    else if (/수강료|학원비|강습비|가격|얼마|비용(?!의)|\d\s*만?\s*원|원\s*인상/.test(q)) intent.category = 'tuition';
    else if (/담당자|내선|전화|직통|연락처|주소|위치|어디|부원장|팀장|과장|대리|주임|사원|선생님|기획팀|인사팀|재무팀|총무팀|법무팀|관리팀|경영관리|경영본부|사업부|본부|부서|팀$|팀\s|팀[\?!\.]|팀의/.test(q)) intent.category = 'contacts';
    // 담당자명 사전 매칭 (고수정·조병룡 등 이름만 입력해도 contacts로 유도)
    else if (getContactNames().some(name => q.includes(name))) intent.category = 'contacts';
    else if (/응대|스크립트|환불|클레임|문의|대응/.test(q)) intent.category = 'parent_response';
    else if (/감탄|친절|응대 매뉴얼/.test(q)) intent.category = 'cs_appreciation';
    else if (/매뉴얼|절차|방법|어떻게|등록|아카|비즈메카|교육청/.test(q)) intent.category = 'admin';

    // 캠퍼스 힌트
    const campuses = ['이매', '수내', '수지', '광교', '영통', '정자', '본사', '잠실'];
    for (const c of campuses) {
      if (q.includes(c)) { intent.campus = c; break; }
    }

    return intent;
  }

  // ⭐ 카테고리별 답변 템플릿 ⭐
  function formatAnswer(item) {
    const cat = item.category;
    const c = item.content || {};

    if (cat === 'contacts') return formatContact(item, c);
    if (cat === 'tuition') return formatTuition(item, c);
    if (cat === 'admin') return formatAdmin(item, c);
    if (cat === 'parent_response' || cat === 'parent-response') return formatParentResponse(item, c);
    if (cat === 'cs_appreciation' || cat === 'cs-appreciation') return formatCSAppreciation(item, c);
    if (cat === 'campus_guide' || cat === 'campus-guide') return formatCampusGuide(item, c);
    if (cat === 'files') return formatFile(item);
    return `${item.title}\n\n${Object.entries(c).filter(([k,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n')}`;
  }

  function formatFile(item) {
    const lines = [];
    // DATA.files 원본에서 추가 메타 조회
    const raw = (DATA.files || []).find(f => f.id === item.id || ('file-' + (f.id || '')) === item.id);
    const fileType = raw && raw.file_type ? raw.file_type : '';
    const updated = raw && raw.updated ? raw.updated : '';
    lines.push(`📄 ${item.title}`);
    const meta = [];
    if (item.subcategory) meta.push(`🏷️ ${item.subcategory}`);
    if (fileType) meta.push(`📎 ${fileType}`);
    if (updated) meta.push(`📅 ${updated}`);
    if (meta.length) lines.push(meta.join('  ·  '));
    if (item.content) { lines.push(''); lines.push(item.content); }
    return lines.join('\n');
  }

  function formatContact(item, c) {
    const lines = [];
    const icon = item.subcategory === '본사' ? '🏛️' : (item.subcategory === '캠퍼스 대표' ? '🏢' : '📍');
    lines.push(`${icon} ${item.title}`);
    lines.push('');

    if (c.직통번호 && c.직통번호 !== c.대표번호) lines.push(`📞 직통: ${c.직통번호}`);
    if (c.대표번호) lines.push(`📞 대표번호: ${c.대표번호}`);
    if (c.담당자) {
      lines.push('');
      lines.push(`👤 담당자:`);
      // 괄호 내부 "·"와 구분자 "·"를 분리:
      // ") · " 또는 "] · " 패턴만 담당자 구분자로 간주
      let persons;
      if (/\)\s·\s|\]\s·\s/.test(c.담당자)) {
        persons = c.담당자.split(/(?<=[\)\]])\s·\s/);
      } else {
        persons = c.담당자.split(/\s·\s/);
      }
      persons.forEach(p => lines.push(`  • ${p.trim()}`));
    }
    if (c.내선 && !c.담당자) lines.push(`📱 내선: ${c.내선}`);
    if (c.위치) {
      lines.push('');
      lines.push(`📍 위치: ${c.위치}`);
    }
    if (c.학원등록번호) lines.push(`🏫 학원등록: ${c.학원등록번호}`);
    if (c.비고) {
      lines.push('');
      lines.push(`💡 ${c.비고}`);
    }
    return lines.join('\n');
  }

  function formatTuition(item, c) {
    const lines = [];
    lines.push(`💰 ${item.title}`);
    lines.push('');
    if (c['26년_수강료']) {
      lines.push(`▶ 26년 수강료: ${c['26년_수강료'].toLocaleString()}원`);
    }
    if (c['25년_수강료'] && c.인상액 != null) {
      const up = c.인상액;
      if (up > 0) {
        lines.push(`   25년 대비 ↑ ${up.toLocaleString()}원 인상`);
        lines.push(`   (25년: ${c['25년_수강료'].toLocaleString()}원)`);
      } else if (up < 0) {
        lines.push(`   25년 대비 ↓ ${Math.abs(up).toLocaleString()}원 인하`);
        lines.push(`   (25년: ${c['25년_수강료'].toLocaleString()}원)`);
      } else {
        lines.push(`   25년과 동일: ${c['25년_수강료'].toLocaleString()}원`);
      }
    }
    lines.push('');
    const spec = [];
    if (c.브랜드) spec.push(`브랜드: ${c.브랜드}`);
    if (c.회당) spec.push(`회당: ${c.회당}`);
    if (c.과정) spec.push(`과정: ${c.과정}`);
    if (c.사업부) spec.push(`사업부: ${c.사업부}`);
    if (spec.length) lines.push(spec.join(' · '));
    if (c.비고) {
      lines.push('');
      lines.push(`💡 ${c.비고}`);
    }
    return lines.join('\n');
  }

  function formatAdmin(item, c) {
    const lines = [];
    lines.push(`📖 ${item.title}`);
    if (item.subcategory) lines.push(`[${item.subcategory}]`);
    lines.push('');

    // 반형태/수익코드
    if (c.고유번호) {
      lines.push(`▶ 고유번호: ${c.고유번호}`);
      if (c.교육관) lines.push(`교육관: ${c.교육관}`);
      if (c.브랜드) lines.push(`브랜드: ${c.브랜드}`);
      if (c.캠퍼스) lines.push(`캠퍼스: ${c.캠퍼스}`);
      if (c.반형태) {
        lines.push('');
        lines.push(`📝 반형태:\n${c.반형태}`);
      }
      if (c['담당 CS']) lines.push(`\n👤 담당 CS: ${c['담당 CS']}`);
      if (c.건물명) lines.push(`🏢 ${c.건물명}${c.층수 ? ' ' + c.층수 : ''}`);
      if (c.학원등록번호) lines.push(`🏫 ${c.학원등록번호}`);
      if (c.수익경로) lines.push(`\n💼 수익경로: ${c.수익경로}`);
      return lines.join('\n');
    }

    // 일반 매뉴얼
    if (c.본문) {
      const body = c.본문.length > 500 ? c.본문.substring(0, 500) + '...\n\n(상세는 "📖 매뉴얼" 메뉴에서 확인)' : c.본문;
      lines.push(body);
    } else if (c.markdown) {
      const md = c.markdown.length > 500 ? c.markdown.substring(0, 500) + '...' : c.markdown;
      lines.push(md);
    }
    return lines.join('\n');
  }

  function formatParentResponse(item, c) {
    const lines = [];
    lines.push(`💬 ${item.title}`);
    if (item.subcategory) lines.push(`[${item.subcategory}]`);
    lines.push('');
    if (c.markdown) {
      const md = c.markdown.length > 600 ? c.markdown.substring(0, 600) + '...' : c.markdown;
      lines.push(md);
    }
    if (c.recommended) {
      lines.push('');
      lines.push(`✅ 권장 응대:`);
      lines.push(c.recommended);
    }
    if (c.avoid) {
      lines.push('');
      lines.push(`❌ 피해야 할 응대:`);
      lines.push(c.avoid);
    }
    return lines.join('\n');
  }

  function formatCSAppreciation(item, c) {
    return formatParentResponse(item, c).replace('💬', '⭐');
  }

  function formatCampusGuide(item, c) {
    return formatParentResponse(item, c).replace('💬', '🏫');
  }

  // 초기화
  async function init() {
    await loadConfig();
  }

  return { toggle, clear, send, ask, init };
})();

// ==================== 시작 ====================
loadData().then(() => FlowBot.init());
</script>
